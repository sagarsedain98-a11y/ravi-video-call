<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ravi Random Video Chat</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  background:#111;
}

video{
  position:absolute;
  background:#000;
  object-fit:cover;
}

#remoteVideo{
  inset:0;
  width:100%;
  height:100%;
}

#localVideo{
  top:75px;
  right:12px;
  width:105px;
  height:150px;
  border:2px solid white;
  border-radius:15px;
  z-index:5;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:18px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#000c,transparent);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.status{
  padding:7px 12px;
  border-radius:20px;
  background:#475569;
  font-size:12px;
}

.bottom{
  position:absolute;
  z-index:10;
  left:0;
  right:0;
  bottom:0;
  padding:20px 12px 28px;
  text-align:center;
  background:linear-gradient(transparent,#000e);
}

#message{
  font-size:14px;
  margin-bottom:15px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  color:white;
  font-weight:bold;
  font-size:15px;
  padding:14px 20px;
  border-radius:28px;
  cursor:pointer;
}

#startBtn{
  background:#16a34a;
}

#nextBtn{
  background:#2563eb;
}

#endBtn{
  background:#dc2626;
}

#muteBtn,
#cameraBtn{
  width:52px;
  height:52px;
  padding:0;
  border-radius:50%;
  background:#333;
}

button:disabled{
  opacity:.45;
}
</style>
</head>

<body>

<div id="app">

  <video id="remoteVideo" autoplay playsinline></video>

  <video id="localVideo" autoplay muted playsinline></video>

  <div class="top">
    <div class="logo">📹 Ravi Chat</div>
    <div id="status" class="status">Offline</div>
  </div>

  <div class="bottom">

    <div id="message">
      Press Start to begin
    </div>

    <div class="buttons">

      <button id="startBtn">
        ▶ Start
      </button>

      <button id="nextBtn" disabled>
        ⏭ Next
      </button>

      <button id="muteBtn" disabled>
        🎤
      </button>

      <button id="cameraBtn" disabled>
        📷
      </button>

      <button id="endBtn" disabled>
        ☎ End
      </button>

    </div>

  </div>

</div>


<!-- Metered Video SDK -->
<script src="https://cdn.metered.ca/sdk/video/1.4.6/sdk.min.js"></script>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  collection,
  addDoc,
  onSnapshot,
  query,
  where,
  getDocs,
  limit
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

  authDomain:
  "ravi-video-call-fa15d.firebaseapp.com",

  projectId:
  "ravi-video-call-fa15d",

  storageBucket:
  "ravi-video-call-fa15d.firebasestorage.app",

  messagingSenderId:
  "1079442344769",

  appId:
  "1:1079442344769:web:d7812efaf277c3f6d4efc0",

  measurementId:
  "G-69RY93XC91"
};

const firebaseApp =
  initializeApp(firebaseConfig);

const db =
  getFirestore(firebaseApp);


/* =========================================
   METERED
========================================= */

const METERED_DOMAIN =
  "ravi-video-call.metered.live";


/*
 IMPORTANT:

 Do NOT put your Metered SECRET KEY here.

 This example uses the public Metered SDK
 and a generated room name.

 Your Metered project must allow video
 meetings.
*/


/* =========================================
   ELEMENTS
========================================= */

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const startBtn =
  document.getElementById("startBtn");

const nextBtn =
  document.getElementById("nextBtn");

const endBtn =
  document.getElementById("endBtn");

const muteBtn =
  document.getElementById("muteBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const statusEl =
  document.getElementById("status");

const messageEl =
  document.getElementById("message");


/* =========================================
   STATE
========================================= */

let meeting = null;

let userId =
  crypto.randomUUID();

let queueId = null;

let currentRoom = null;

let currentPartner = null;

let queueListener = null;

let roomListener = null;

let muted = false;

let cameraOff = false;

let busy = false;


/* =========================================
   UI
========================================= */

function status(text){

  statusEl.innerText = text;

  if(text.includes("Online") ||
     text.includes("Connected")){

    statusEl.style.background =
      "#16a34a";

  }else if(
    text.includes("Searching") ||
    text.includes("Connecting")){

    statusEl.style.background =
      "#f59e0b";

  }else{

    statusEl.style.background =
      "#475569";

  }
}


function message(text){

  messageEl.innerText = text;

}


/* =========================================
   ENABLE / DISABLE
========================================= */

function setCallButtons(enabled){

  nextBtn.disabled =
    !enabled;

  endBtn.disabled =
    !enabled;

  muteBtn.disabled =
    !enabled;

  cameraBtn.disabled =
    !enabled;

}


/* =========================================
   RANDOM ROOM
========================================= */

function createRoomId(){

  const random =
    Math.random()
    .toString(36)
    .substring(2,10);

  return "ravi-" + random;

}


/* =========================================
   START LOCAL CAMERA
========================================= */

async function prepareCamera(){

  const stream =
    await navigator.mediaDevices
    .getUserMedia({

      video:true,
      audio:true

    });

  localVideo.srcObject =
    stream;

  return stream;

}


/* =========================================
   CREATE QUEUE ENTRY
========================================= */

async function enterQueue(){

  queueId = userId;

  await setDoc(

    doc(
      db,
      "matchQueue",
      queueId
    ),

    {
      userId:userId,
      state:"waiting",
      partner:null,
      createdAt:Date.now()
    }

  );

}


/* =========================================
   FIND WAITING USER
========================================= */

async function findPartner(){

  const q =
    query(

      collection(
        db,
        "matchQueue"
      ),

      where(
        "state",
        "==",
        "waiting"
      ),

      limit(10)

    );

  const snapshot =
    await getDocs(q);

  for(
    const item of snapshot.docs
  ){

    const data =
      item.data();

    if(
      data.userId === userId
    ){
      continue;
    }

    /*
      Claim the partner.

      Re-read the document first so that
      the other phone has not already been
      matched.
    */

    const partnerRef =
      doc(
        db,
        "matchQueue",
        data.userId
      );

    const latest =
      await getDoc(
        partnerRef
      );

    if(!latest.exists()){
      continue;
    }

    const latestData =
      latest.data();

    if(
      latestData.state !==
      "waiting"
    ){
      continue;
    }

    const roomId =
      createRoomId();

    currentRoom =
      roomId;

    currentPartner =
      data.userId;


    await setDoc(
      partnerRef,

      {
        ...latestData,
        state:"matched",
        partner:userId,
        roomId:roomId
      }

    );


    await setDoc(

      doc(
        db,
        "matchQueue",
        userId
      ),

      {
        userId:userId,
        state:"matched",
        partner:data.userId,
        roomId:roomId,
        createdAt:Date.now()
      }

    );


    return true;

  }

  return false;

}


/* =========================================
   LISTEN FOR MATCH
========================================= */

function listenForMatch(){

  if(queueListener){
    queueListener();
  }

  const ref =
    doc(
      db,
      "matchQueue",
      userId
    );

  queueListener =
    onSnapshot(
      ref,
      async snapshot => {

        if(!snapshot.exists()){
          return;
        }

        const data =
          snapshot.data();

        if(
          data.state ===
          "matched" &&
          data.roomId
        ){

          currentRoom =
            data.roomId;

          currentPartner =
            data.partner;

          message(
            "🎉 Partner found! Connecting..."
          );

          status(
            "Connecting..."
          );

          await joinMeteredRoom(
            currentRoom
          );

        }

      }
    );

}


/* =========================================
   JOIN METERED ROOM
========================================= */

async function joinMeteredRoom(
  roomId
){

  if(busy){
    return;
  }

  busy = true;

  try{

    if(!window.Metered){

      throw new Error(
        "Metered SDK did not load."
      );

    }


    meeting =
      new Metered.Meeting();


    const roomURL =
      METERED_DOMAIN +
      "/" +
      roomId;


    const meetingInfo =
      await meeting.join({

        roomURL:
          roomURL,

        name:
          "Ravi User"

      });


    console.log(
      "Meeting joined:",
      meetingInfo
    );


    /* Local video */

    meeting.on(
      "localTrackStarted",
      function(item){

        if(
          item.type ===
          "video"
        ){

          const stream =
            new MediaStream([
              item.track
            ]);

          localVideo.srcObject =
            stream;

          localVideo.play()
          .catch(()=>{});

        }

      }
    );


    /* Remote video */

    meeting.on(
      "remoteTrackStarted",
      function(item){

        console.log(
          "Remote track:",
          item
        );

        if(
          item.type ===
          "video"
        ){

          const stream =
            new MediaStream([
              item.track
            ]);

          remoteVideo.srcObject =
            stream;

          remoteVideo.play()
          .catch(()=>{});

          status(
            "🟢 Connected"
          );

          message(
            "🎥 You are now connected"
          );

          setCallButtons(
            true
          );

        }

      }
    );


    meeting.on(
      "participantJoined",
      function(info){

        console.log(
          "Participant joined:",
          info
        );

        status(
          "🟢 Connected"
        );

        message(
          "🎥 Video chat connected"
        );

        setCallButtons(
          true
        );

      }
    );


    meeting.on(
      "participantLeft",
      function(info){

        console.log(
          "Participant left:",
          info
        );

        message(
          "👋 Partner left. Press Next."
        );

        status(
          "Online"
        );

      }
    );


    /*
      Start camera + microphone.
    */

    try{

      await meeting.startVideo();

    }catch(error){

      console.log(
        "startVideo error:",
        error
      );

    }


    try{

      await meeting.startAudio();

    }catch(error){

      console.log(
        "startAudio error:",
        error
      );

    }


    setCallButtons(
      true
    );

  }catch(error){

    console.error(
      error
    );

    message(
      "❌ Connection failed"
    );

    status(
      "Offline"
    );

    alert(
      "Video connection error: " +
      error.message
    );

  }

  busy = false;

}


/* =========================================
   START RANDOM CHAT
========================================= */

async function startRandomChat(){

  if(busy){
    return;
  }

  try{

    busy = true;

    startBtn.disabled =
      true;

    status(
      "🟢 Online"
    );

    message(
      "🎥 Opening camera..."
    );


    await prepareCamera();


    message(
      "🔎 Finding a random partner..."
    );

    status(
      "Searching..."
    );


    await enterQueue();

    listenForMatch();


    const found =
      await findPartner();


    if(!found){

      message(
        "🔎 Waiting for a random partner..."
      );

      status(
        "Searching..."
      );

    }


  }catch(error){

    console.error(
      error
    );

    alert(
      "Camera/Microphone error: " +
      error.message
    );

    status(
      "Offline"
    );

    startBtn.disabled =
      false;

  }

  busy = false;

}


/* =========================================
   NEXT
========================================= */

async function nextPartner(){

  message(
    "⏭ Finding another partner..."
  );

  status(
    "Searching..."
  );


  await leaveCurrentMeeting();


  currentRoom =
    null;

  currentPartner =
    null;


  await enterQueue();


  const found =
    await findPartner();


  if(!found){

    message(
      "🔎 Waiting for another random partner..."
    );

  }

}


/* =========================================
   LEAVE CURRENT MEETING
========================================= */

async function leaveCurrentMeeting(){

  try{

    if(meeting){

      if(
        typeof meeting.leaveMeeting ===
        "function"
      ){

        await meeting.leaveMeeting();

      }else if(
        typeof meeting.leave ===
        "function"
      ){

        await meeting.leave();

      }

    }

  }catch(error){

    console.log(
      "Leave error:",
      error
    );

  }

  meeting =
    null;


  remoteVideo.srcObject =
    null;


  /*
    Keep camera available for Next.
  */

}


/* =========================================
   END
========================================= */

async function endCall(){

  await leaveCurrentMeeting();


  if(queueListener){

    queueListener();

    queueListener =
      null;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "matchQueue",
        userId
      )
    );

  }catch(error){

    console.log(
      error
    );

  }


  if(localVideo.srcObject){

    localVideo
    .srcObject
    .getTracks()
    .forEach(
      track =>
        track.stop()
    );

  }


  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;


  currentRoom =
    null;

  currentPartner =
    null;


  setCallButtons(
    false
  );


  startBtn.disabled =
    false;


  status(
    "Offline"
  );

  message(
    "Press Start to begin"
  );

}


/* =========================================
   MUTE
========================================= */

muteBtn.onclick =
async()=>{

  if(!meeting){
    return;
  }

  try{

    if(!muted){

      if(
        typeof meeting.stopAudio ===
        "function"
      ){

        await meeting.stopAudio();

      }

      muted = true;

      muteBtn.innerText =
        "🔇";

    }else{

      if(
        typeof meeting.startAudio ===
        "function"
      ){

        await meeting.startAudio();

      }

      muted = false;

      muteBtn.innerText =
        "🎤";

    }

  }catch(error){

    console.log(
      error
    );

  }

};


/* =========================================
   CAMERA
========================================= */

cameraBtn.onclick =
async()=>{

  if(!meeting){
    return;
  }

  try{

    if(!cameraOff){

      if(
        typeof meeting.stopVideo ===
        "function"
      ){

        await meeting.stopVideo();

      }

      cameraOff = true;

      cameraBtn.innerText =
        "🚫";

    }else{

      if(
        typeof meeting.startVideo ===
        "function"
      ){

        await meeting.startVideo();

      }

      cameraOff = false;

      cameraBtn.innerText =
        "📷";

    }

  }catch(error){

    console.log(
      error
    );

  }

};


/* =========================================
   BUTTONS
========================================= */

startBtn.onclick =
startRandomChat;

nextBtn.onclick =
nextPartner;

endBtn.onclick =
endCall;


/* =========================================
   INITIAL
========================================= */

status(
  "Offline"
);

message(
  "Press Start to begin"
);

setCallButtons(
  false
);

</script>

</body>
</html>
