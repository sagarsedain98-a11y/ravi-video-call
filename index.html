<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ravi Video Call</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0d1820;
  color: white;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

h1 {
  font-size: 38px;
  margin: 15px 0 25px;
}

h2 {
  margin-top: 25px;
}

label {
  display: block;
  font-size: 20px;
  margin: 15px 0 8px;
}

input {
  width: 95%;
  padding: 18px;
  border: none;
  border-radius: 18px;
  font-size: 18px;
  outline: none;
}

button {
  border: none;
  border-radius: 16px;
  padding: 15px 22px;
  margin: 10px 5px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.green {
  background: #20c763;
  color: white;
}

.red {
  background: #ef3d3d;
  color: white;
}

.gray {
  background: #555;
  color: white;
}

.idBox {
  background: white;
  color: #222;
  padding: 18px;
  border-radius: 18px;
  font-size: 18px;
  word-break: break-all;
  min-height: 58px;
}

#status {
  margin: 20px 0;
  color: #70f5a0;
  font-size: 20px;
  min-height: 28px;
}

.videoBox {
  width: 100%;
  margin-top: 15px;
  background: black;
  border-radius: 18px;
  overflow: hidden;
}

video {
  width: 100%;
  display: block;
  background: black;
  min-height: 220px;
  object-fit: cover;
}

.controls {
  margin-top: 10px;
}

hr {
  margin: 25px 0;
}

#incoming {
  display: none;
  background: #222;
  padding: 15px;
  border-radius: 18px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>📹 Ravi Video Call</h1>

<label>Your Call ID:</label>

<div id="myId" class="idBox">
  Loading...
</div>

<button class="green" onclick="copyMyId()">
  📋 Copy Call ID
</button>

<hr>

<label>Enter Friend's Call ID:</label>

<input
  id="friendId"
  type="text"
  placeholder="Friend's Call ID"
/>

<br>

<button class="green" onclick="startCall()">
  📞 Start Video Call
</button>

<button class="red" onclick="endCall()">
  ❌ End Call
</button>

<div id="incoming">

  <h3>📞 Incoming Video Call</h3>

  <button class="green" onclick="answerCall()">
    ✅ Accept
  </button>

  <button class="red" onclick="rejectCall()">
    ❌ Reject
  </button>

</div>

<div id="status">
  Starting camera...
</div>

<h2>📷 Your Camera</h2>

<div class="videoBox">
  <video id="localVideo" autoplay muted playsinline></video>
</div>

<h2>👤 Friend's Camera</h2>

<div class="videoBox">
  <video id="remoteVideo" autoplay playsinline></video>
</div>

<div class="controls">

  <button class="gray" onclick="toggleCamera()">
    📷 Camera On/Off
  </button>

  <button class="gray" onclick="toggleMic()">
    🎤 Mic On/Off
  </button>

</div>

</div>

<script>

let peer;
let localStream = null;
let currentCall = null;
let incomingCall = null;


/* =========================
   START CAMERA
========================= */

async function startCamera() {

  try {

    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    document.getElementById("localVideo").srcObject = localStream;

    setStatus("Camera ready ✅");

    createPeer();

  } catch (error) {

    console.error(error);

    setStatus(
      "Camera/Microphone permission दिनुहोस् ❌"
    );

  }

}


/* =========================
   CREATE PEER
========================= */

function createPeer() {

  peer = new Peer();

  peer.on("open", function(id) {

    document.getElementById("myId").innerText = id;

    setStatus(
      "Ready! अब Call ID share गर्नुहोस् ✅"
    );

  });


  /* INCOMING CALL */

  peer.on("call", function(call) {

    incomingCall = call;

    document.getElementById("incoming").style.display = "block";

    setStatus(
      "📞 Incoming call आएको छ!"
    );

  });


  peer.on("error", function(error) {

    console.error(error);

    setStatus(
      "Connection error: " + error.type
    );

  });

}


/* =========================
   START OUTGOING CALL
========================= */

function startCall() {

  const friendId =
    document.getElementById("friendId").value.trim();

  if (!friendId) {

    alert("Friend's Call ID राख्नुहोस्।");

    return;

  }

  if (!localStream) {

    alert("Camera सुरु भएको छैन।");

    return;

  }

  if (!peer) {

    alert("Connecting... केही सेकेन्ड पर्खनुहोस्।");

    return;

  }


  setStatus("📞 Calling...");


  const call = peer.call(
    friendId,
    localStream
  );

  currentCall = call;


  call.on("stream", function(remoteStream) {

    document.getElementById("remoteVideo").srcObject =
      remoteStream;

    setStatus("🟢 Video Call Connected");

  });


  call.on("close", function() {

    setStatus("Call ended.");

    clearRemoteVideo();

  });


  call.on("error", function(error) {

    console.error(error);

    setStatus(
      "Call error: " + error.type
    );

  });

}


/* =========================
   ACCEPT INCOMING CALL
========================= */

function answerCall() {

  if (!incomingCall) return;

  if (!localStream) {

    alert("Camera सुरु भएको छैन।");

    return;

  }


  document.getElementById("incoming").style.display =
    "none";

  setStatus("Connecting...");


  incomingCall.answer(localStream);

  currentCall = incomingCall;


  incomingCall.on("stream", function(remoteStream) {

    document.getElementById("remoteVideo").srcObject =
      remoteStream;

    setStatus("🟢 Video Call Connected");

  });


  incomingCall.on("close", function() {

    setStatus("Call ended.");

    clearRemoteVideo();

  });


  incomingCall.on("error", function(error) {

    console.error(error);

    setStatus(
      "Call error: " + error.type
    );

  });


  incomingCall = null;

}


/* =========================
   REJECT CALL
========================= */

function rejectCall() {

  if (incomingCall) {

    incomingCall.close();

    incomingCall = null;

  }

  document.getElementById("incoming").style.display =
    "none";

  setStatus("Call rejected.");

}


/* =========================
   END CALL
========================= */

function endCall() {

  if (currentCall) {

    currentCall.close();

    currentCall = null;

  }

  if (incomingCall) {

    incomingCall.close();

    incomingCall = null;

  }

  clearRemoteVideo();

  document.getElementById("incoming").style.display =
    "none";

  setStatus("Call ended ❌");

}


/* =========================
   CAMERA ON/OFF
========================= */

function toggleCamera() {

  if (!localStream) return;

  const track =
    localStream.getVideoTracks()[0];

  if (track) {

    track.enabled = !track.enabled;

    if (track.enabled) {

      setStatus("📷 Camera ON");

    } else {

      setStatus("📷 Camera OFF");

    }

  }

}


/* =========================
   MIC ON/OFF
========================= */

function toggleMic() {

  if (!localStream) return;

  const track =
    localStream.getAudioTracks()[0];

  if (track) {

    track.enabled = !track.enabled;

    if (track.enabled) {

      setStatus("🎤 Microphone ON");

    } else {

      setStatus("🔇 Microphone OFF");

    }

  }

}


/* =========================
   COPY CALL ID
========================= */

function copyMyId() {

  const id =
    document.getElementById("myId").innerText;

  if (
    !id ||
    id === "Loading..."
  ) {

    alert("Call ID अझै आएको छैन।");

    return;

  }


  navigator.clipboard.writeText(id)
    .then(function() {

      alert(
        "Call ID copied ✅\nअब साथीलाई पठाउनुहोस्।"
      );

    })
    .catch(function() {

      alert(
        "Call ID copy गर्न सकिएन। Manually copy गर्नुहोस्।"
      );

    });

}


/* =========================
   STATUS
========================= */

function setStatus(text) {

  document.getElementById("status").innerText =
    text;

}


/* =========================
   CLEAR REMOTE VIDEO
========================= */

function clearRemoteVideo() {

  const video =
    document.getElementById("remoteVideo");

  video.srcObject = null;

}


/* =========================
   START APP
========================= */

window.addEventListener(
  "load",
  startCamera
);

</script>

</body>
</html>
