<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ravi Video Call</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#101828;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:20px 0 5px;
}

.status{
  margin:8px;
  color:#4ade80;
  font-weight:bold;
}

.videos{
  display:flex;
  flex-direction:column;
  gap:15px;
  padding:15px;
}

video{
  width:100%;
  max-width:600px;
  height:250px;
  background:#000;
  border-radius:18px;
  object-fit:cover;
  margin:auto;
}

.controls{
  padding:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:15px 22px;
  margin:8px;
  font-size:17px;
  font-weight:bold;
  color:white;
}

#startBtn{
  background:#22c55e;
}

#joinBtn{
  background:#3b82f6;
}

#hangupBtn{
  background:#ef4444;
}

input{
  width:90%;
  max-width:400px;
  padding:16px;
  margin:10px;
  border:0;
  border-radius:12px;
  font-size:17px;
}

#roomCode{
  color:#facc15;
  font-size:20px;
  font-weight:bold;
  margin:15px;
  word-break:break-all;
}

#connection{
  margin:10px;
  color:#60a5fa;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>📹 Ravi Video Call</h1>

<div class="status" id="status">
🟢 Ready
</div>

<div id="connection">
Waiting...
</div>

<div class="videos">

<video
id="localVideo"
autoplay
muted
playsinline>
</video>

<video
id="remoteVideo"
autoplay
playsinline>
</video>

</div>

<div class="controls">

<button id="startBtn">
📞 Create Call
</button>

<div id="roomCode"></div>

<input
id="roomInput"
type="text"
placeholder="Enter Room Code">

<br>

<button id="joinBtn">
📲 Join Call
</button>

<button id="hangupBtn">
❌ Hang Up
</button>

</div>


<script type="module">

/* ================================
   FIREBASE
================================ */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  collection,
  addDoc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

  authDomain:
  "ravi-video-call-fa15d.firebaseapp.com",

  projectId:
  "ravi-video-call-fa15d",

  storageBucket:
  "ravi-video-call-fa15d.firebasestorage.app",

  messagingSenderId:
  "1079442344769",

  appId:
  "1:1079442344769:web:d7812efaf277c3f6d4efc0",

  measurementId:
  "G-69RY93XC91"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ================================
   HTML ELEMENTS
================================ */

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");

const startBtn =
document.getElementById("startBtn");

const joinBtn =
document.getElementById("joinBtn");

const hangupBtn =
document.getElementById("hangupBtn");

const roomInput =
document.getElementById("roomInput");

const roomCode =
document.getElementById("roomCode");

const statusText =
document.getElementById("status");

const connectionText =
document.getElementById("connection");


/* ================================
   VARIABLES
================================ */

let localStream = null;

let remoteStream = null;

let peerConnection = null;

let currentRoom = null;

let pendingCandidates = [];

let remoteDescriptionSet = false;


/* ================================
   STUN + TURN SERVERS
================================ */

const servers = {

  iceServers: [

    /* STUN */

    {
      urls:
      "stun:openrelay.metered.ca:80"
    },


    /* TURN UDP */

    {
      urls:
      "turn:openrelay.metered.ca:80",

      username:
      "openrelayproject",

      credential:
      "openrelayproject"
    },


    /* TURN TCP */

    {
      urls:
      "turn:openrelay.metered.ca:443",

      username:
      "openrelayproject",

      credential:
      "openrelayproject"
    },


    /* TURN TCP forced */

    {
      urls:
      "turn:openrelay.metered.ca:443?transport=tcp",

      username:
      "openrelayproject",

      credential:
      "openrelayproject"
    }

  ],

  iceCandidatePoolSize:10
};


/* ================================
   ADD ICE CANDIDATE SAFELY
================================ */

async function addCandidateSafely(candidate){

  try{

    if(
      peerConnection &&
      remoteDescriptionSet
    ){

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

    }else{

      pendingCandidates.push(candidate);

    }

  }catch(error){

    console.error(
      "ICE candidate error:",
      error
    );

  }

}


/* ================================
   PROCESS WAITING CANDIDATES
================================ */

async function processPendingCandidates(){

  if(!peerConnection){
    return;
  }

  for(
    const candidate
    of pendingCandidates
  ){

    try{

      await peerConnection.addIceCandidate(
        new RTCIceCandidate(candidate)
      );

    }catch(error){

      console.error(
        "Pending ICE error:",
        error
      );

    }

  }

  pendingCandidates = [];

}


/* ================================
   CAMERA + MICROPHONE
================================ */

async function startCamera(){

  statusText.innerText =
  "🟡 Opening camera...";


  localStream =
  await navigator.mediaDevices.getUserMedia({

    video:true,

    audio:true

  });


  localVideo.srcObject =
  localStream;


  remoteStream =
  new MediaStream();


  remoteVideo.srcObject =
  remoteStream;


  peerConnection =
  new RTCPeerConnection(
    servers
  );


  /* ADD LOCAL TRACKS */

  localStream
  .getTracks()
  .forEach(track=>{

    peerConnection.addTrack(
      track,
      localStream
    );

  });


  /* RECEIVE REMOTE TRACKS */

  peerConnection.ontrack =
  event=>{

    console.log(
      "Remote track received"
    );


    event.streams[0]
    .getTracks()
    .forEach(track=>{

      remoteStream.addTrack(
        track
      );

    });


    remoteVideo.srcObject =
    remoteStream;


    statusText.innerText =
    "🟢 Video Connected";

  };


  /* CONNECTION STATUS */

  peerConnection.onconnectionstatechange =
  ()=>{

    console.log(
      "Connection:",
      peerConnection.connectionState
    );


    connectionText.innerText =
    "Connection: " +
    peerConnection.connectionState;


    if(
      peerConnection.connectionState
      === "connected"
    ){

      statusText.innerText =
      "🟢 Call Connected";

    }


    if(
      peerConnection.connectionState
      === "connecting"
    ){

      statusText.innerText =
      "🟡 Connecting...";

    }


    if(
      peerConnection.connectionState
      === "failed"
    ){

      statusText.innerText =
      "🔴 Connection Failed";

    }

  };


  /* ICE STATUS */

  peerConnection.oniceconnectionstatechange =
  ()=>{

    console.log(
      "ICE:",
      peerConnection.iceConnectionState
    );

    connectionText.innerText =
    "ICE: " +
    peerConnection.iceConnectionState;

  };

}


/* ================================
   CREATE CALL
================================ */

startBtn.onclick =
async()=>{

  try{

    pendingCandidates = [];

    remoteDescriptionSet = false;


    await startCamera();


    statusText.innerText =
    "🟡 Creating call...";


    /* CREATE FIREBASE ROOM */

    const roomRef =
    doc(
      collection(
        db,
        "rooms"
      )
    );


    currentRoom =
    roomRef.id;


    const callerCandidates =
    collection(
      roomRef,
      "callerCandidates"
    );


    const calleeCandidates =
    collection(
      roomRef,
      "calleeCandidates"
    );


    /* SEND CALLER ICE */

    peerConnection.onicecandidate =
    async event=>{

      if(event.candidate){

        await addDoc(
          callerCandidates,
          event.candidate.toJSON()
        );

      }

    };


    /* CREATE OFFER */

    const offer =
    await peerConnection.createOffer();


    await peerConnection.setLocalDescription(
      offer
    );


    /* SAVE OFFER */

    await setDoc(
      roomRef,
      {

        offer:{
          type:offer.type,
          sdp:offer.sdp
        },

        createdAt:
        Date.now()

      }
    );


    roomCode.innerText =
    "Room Code: " +
    currentRoom;


    /* WATCH ANSWER */

    onSnapshot(
      roomRef,
      async snapshot=>{

        const data =
        snapshot.data();


        if(
          data &&
          data.answer &&
          !remoteDescriptionSet
        ){

          console.log(
            "Answer received"
          );


          await peerConnection
          .setRemoteDescription(

            new RTCSessionDescription(
              data.answer
            )

          );


          remoteDescriptionSet =
          true;


          await processPendingCandidates();

        }

      }
    );


    /* WATCH CALLEE ICE */

    onSnapshot(
      calleeCandidates,
      snapshot=>{

        snapshot
        .docChanges()
        .forEach(change=>{

          if(
            change.type === "added"
          ){

            addCandidateSafely(
              change.doc.data()
            );

          }

        });

      }
    );


    statusText.innerText =
    "🟢 Call Created";


    alert(
      "Call created! Send the Room Code to the other phone."
    );


  }catch(error){

    console.error(error);


    statusText.innerText =
    "🔴 Error";


    alert(
      "Camera/Microphone error:\n" +
      error.message
    );

  }

};


/* ================================
   JOIN CALL
================================ */

joinBtn.onclick =
async()=>{

  try{

    pendingCandidates = [];

    remoteDescriptionSet = false;


    const code =
    roomInput.value.trim();


    if(!code){

      alert(
        "Room Code राख्नुहोस्"
      );

      return;

    }


    statusText.innerText =
    "🟡 Joining...";


    await startCamera();


    currentRoom =
    code;


    const roomRef =
    doc(
      db,
      "rooms",
      code
    );


    const roomSnapshot =
    await getDoc(
      roomRef
    );


    if(
      !roomSnapshot.exists()
    ){

      alert(
        "Room भेटिएन"
      );

      return;

    }


    const roomData =
    roomSnapshot.data();


    const calleeCandidates =
    collection(
      roomRef,
      "calleeCandidates"
    );


    const callerCandidates =
    collection(
      roomRef,
      "callerCandidates"
    );


    /* SEND CALLEE ICE */

    peerConnection.onicecandidate =
    async event=>{

      if(event.candidate){

        await addDoc(
          calleeCandidates,
          event.candidate.toJSON()
        );

      }

    };


    /* SET OFFER */

    await peerConnection
    .setRemoteDescription(

      new RTCSessionDescription(
        roomData.offer
      )

    );


    remoteDescriptionSet =
    true;


    await processPendingCandidates();


    /* CREATE ANSWER */

    const answer =
    await peerConnection.createAnswer();


    await peerConnection.setLocalDescription(
      answer
    );


    /* SAVE ANSWER */

    await updateDoc(
      roomRef,
      {

        answer:{
          type:answer.type,
          sdp:answer.sdp
        }

      }
    );


    /* RECEIVE CALLER ICE */

    onSnapshot(
      callerCandidates,
      snapshot=>{

        snapshot
        .docChanges()
        .forEach(change=>{

          if(
            change.type === "added"
          ){

            addCandidateSafely(
              change.doc.data()
            );

          }

        });

      }
    );


    roomCode.innerText =
    "Room Code: " +
    currentRoom;


    statusText.innerText =
    "🟡 Waiting for video...";


    alert(
      "Joined the call!"
    );


  }catch(error){

    console.error(error);


    statusText.innerText =
    "🔴 Join Error";


    alert(
      "Join error:\n" +
      error.message
    );

  }

};


/* ================================
   HANG UP
================================ */

hangupBtn.onclick =
()=>{

  if(localStream){

    localStream
    .getTracks()
    .forEach(track=>{
      track.stop();
    });

  }


  if(peerConnection){

    peerConnection.close();

  }


  localStream = null;

  remoteStream = null;

  peerConnection = null;

  currentRoom = null;

  pendingCandidates = [];

  remoteDescriptionSet = false;


  localVideo.srcObject =
  null;

  remoteVideo.srcObject =
  null;


  roomCode.innerText =
  "";

  connectionText.innerText =
  "Disconnected";

  statusText.innerText =
  "🔴 Call Ended";

};

</script>

</body>
</html>
