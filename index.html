<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ravi Video Call</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101828;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 22px 0 8px;
    }

    #status {
      display: inline-block;
      padding: 10px 18px;
      margin: 8px 0 18px;
      border-radius: 25px;
      background: #f59e0b;
      color: white;
      font-weight: bold;
    }

    .videos {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 15px;
    }

    video {
      width: 100%;
      max-width: 620px;
      height: 260px;
      background: #000;
      border-radius: 18px;
      object-fit: cover;
      margin: auto;
    }

    .controls {
      padding: 15px;
    }

    input {
      width: 90%;
      max-width: 500px;
      padding: 15px;
      border-radius: 12px;
      border: none;
      margin: 10px;
      font-size: 17px;
    }

    button {
      padding: 15px 24px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #22c55e;
      color: white;
    }

    #joinBtn {
      background: #3b82f6;
      color: white;
    }

    #hangupBtn {
      background: #ef4444;
      color: white;
    }

    #roomCode {
      color: #facc15;
      font-size: 21px;
      font-weight: bold;
      margin: 18px;
      word-break: break-all;
    }

    #info {
      color: #cbd5e1;
      margin: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>📹 Ravi Video Call</h1>

  <div id="status">🟡 Ready</div>

  <div id="info">
    Camera र Microphone सुरु गर्न Create Call वा Join Call थिच्नुहोस्।
  </div>

  <div class="videos">

    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

  </div>

  <div class="controls">

    <button id="startBtn">
      📞 Create Call
    </button>

    <div id="roomCode"></div>

    <input
      id="roomInput"
      type="text"
      placeholder="Enter Room Code"
      autocomplete="off"
    >

    <br>

    <button id="joinBtn">
      📲 Join Call
    </button>

    <button id="hangupBtn">
      ❌ Hang Up
    </button>

  </div>


<script type="module">

  /* =========================================
     FIREBASE
  ========================================= */

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    collection,
    addDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


  const firebaseConfig = {

    apiKey:
      "AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

    authDomain:
      "ravi-video-call-fa15d.firebaseapp.com",

    projectId:
      "ravi-video-call-fa15d",

    storageBucket:
      "ravi-video-call-fa15d.firebasestorage.app",

    messagingSenderId:
      "1079442344769",

    appId:
      "1:1079442344769:web:d7812efaf277c3f6d4efc0",

    measurementId:
      "G-69RY93XC91"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  /* =========================================
     HTML ELEMENTS
  ========================================= */

  const localVideo =
    document.getElementById("localVideo");

  const remoteVideo =
    document.getElementById("remoteVideo");

  const startBtn =
    document.getElementById("startBtn");

  const joinBtn =
    document.getElementById("joinBtn");

  const hangupBtn =
    document.getElementById("hangupBtn");

  const roomInput =
    document.getElementById("roomInput");

  const roomCode =
    document.getElementById("roomCode");

  const status =
    document.getElementById("status");

  const info =
    document.getElementById("info");


  /* =========================================
     VARIABLES
  ========================================= */

  let localStream = null;
  let remoteStream = null;
  let peerConnection = null;
  let currentRoom = null;

  let pendingCandidates = [];


  /* =========================================
     WEBRTC SERVERS
     
     STUN works for many networks.
     
     TURN credentials यहाँ राख्न सकिन्छ।
     ========================================= */

  const servers = {

    iceServers: [

      {
        urls:
          "stun:stun.l.google.com:19302"
      },

      /*
       * TURN SERVER
       *
       * आफ्नो TURN server भएमा तलको
       * section मा वास्तविक जानकारी राख्नुहोस्।
       *
       * Example:
       *
       * {
       *   urls: "turn:YOUR-TURN-SERVER:3478",
       *   username: "YOUR_USERNAME",
       *   credential: "YOUR_PASSWORD"
       * }
       */

    ]

  };


  /* =========================================
     CONNECTION STATUS
  ========================================= */

  function setStatus(type, message) {

    if (type === "connected") {

      status.innerText =
        "🟢 Connected";

      status.style.background =
        "#16a34a";

      info.innerText =
        "🎥 Video call connected successfully.";

    }

    else if (type === "connecting") {

      status.innerText =
        "🟡 Connecting...";

      status.style.background =
        "#f59e0b";

      info.innerText =
        "📡 Connecting to the other phone...";

    }

    else if (type === "disconnected") {

      status.innerText =
        "🔴 Disconnected";

      status.style.background =
        "#dc2626";

      info.innerText =
        "Connection disconnected.";

    }

    else if (type === "failed") {

      status.innerText =
        "⚠️ Connection Failed";

      status.style.background =
        "#b91c1c";

      info.innerText =
        "Connection failed. Check internet or TURN server.";

    }

    else {

      status.innerText =
        "⚪ " + message;

      status.style.background =
        "#475569";

      info.innerText =
        message;

    }

  }


  /* =========================================
     CREATE PEER CONNECTION
  ========================================= */

  function createPeerConnection() {

    peerConnection =
      new RTCPeerConnection(servers);


    /* Connection state */

    peerConnection.onconnectionstatechange =
      () => {

        console.log(
          "Connection:",
          peerConnection.connectionState
        );

        switch (
          peerConnection.connectionState
        ) {

          case "new":

            setStatus(
              "connecting",
              "Starting connection..."
            );

            break;


          case "connecting":

            setStatus(
              "connecting",
              "Connecting..."
            );

            break;


          case "connected":

            setStatus(
              "connected",
              "Connected"
            );

            break;


          case "disconnected":

            setStatus(
              "disconnected",
              "Disconnected"
            );

            break;


          case "failed":

            setStatus(
              "failed",
              "Connection failed"
            );

            break;


          case "closed":

            setStatus(
              "disconnected",
              "Call closed"
            );

            break;

        }

      };


    /* ICE connection status */

    peerConnection.oniceconnectionstatechange =
      () => {

        console.log(
          "ICE:",
          peerConnection.iceConnectionState
        );

        if (
          peerConnection.iceConnectionState ===
          "failed"
        ) {

          setStatus(
            "failed",
            "ICE connection failed"
          );

        }

      };


    /* Remote video */

    peerConnection.ontrack =
      event => {

        console.log(
          "Remote track received"
        );

        if (!remoteStream) {

          remoteStream =
            new MediaStream();

          remoteVideo.srcObject =
            remoteStream;

        }

        event.streams[0]
          .getTracks()
          .forEach(track => {

            remoteStream.addTrack(track);

          });

      };


    return peerConnection;

  }


  /* =========================================
     CAMERA + MICROPHONE
  ========================================= */

  async function startCamera() {

    setStatus(
      "connecting",
      "Opening camera..."
    );


    localStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: true

      });


    localVideo.srcObject =
      localStream;


    remoteStream =
      new MediaStream();

    remoteVideo.srcObject =
      remoteStream;


    createPeerConnection();


    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );

      });

  }


  /* =========================================
     CREATE CALL
  ========================================= */

  startBtn.onclick =
    async () => {

      try {

        startBtn.disabled = true;

        setStatus(
          "connecting",
          "Creating call..."
        );


        await startCamera();


        const roomRef =
          doc(collection(db, "rooms"));


        currentRoom =
          roomRef.id;


        const callerCandidates =
          collection(
            roomRef,
            "callerCandidates"
          );


        const calleeCandidates =
          collection(
            roomRef,
            "calleeCandidates"
          );


        /* ICE candidates */

        peerConnection.onicecandidate =
          async event => {

            if (event.candidate) {

              await addDoc(
                callerCandidates,
                event.candidate.toJSON()
              );

            }

          };


        /* Create offer */

        const offer =
          await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
          offer
        );


        /* Save offer */

        await setDoc(
          roomRef,
          {

            offer: {

              type: offer.type,

              sdp: offer.sdp

            }

          }
        );


        roomCode.innerText =
          "Room Code: " +
          currentRoom;


        /* Listen for answer */

        onSnapshot(
          roomRef,
          async snapshot => {

            const data =
              snapshot.data();


            if (
              data &&
              data.answer &&
              !peerConnection.currentRemoteDescription
            ) {

              const answer =
                new RTCSessionDescription(
                  data.answer
                );


              await peerConnection
                .setRemoteDescription(
                  answer
                );


              /* Add waiting ICE candidates */

              for (
                const candidate
                of pendingCandidates
              ) {

                try {

                  await peerConnection
                    .addIceCandidate(
                      candidate
                    );

                } catch (error) {

                  console.log(
                    "ICE error:",
                    error
                  );

                }

              }

              pendingCandidates = [];

            }

          }
        );


        /* Listen for callee candidates */

        onSnapshot(
          calleeCandidates,
          snapshot => {

            snapshot.docChanges()
              .forEach(change => {

                if (
                  change.type === "added"
                ) {

                  const candidate =
                    new RTCIceCandidate(
                      change.doc.data()
                    );


                  if (
                    peerConnection
                      .remoteDescription
                  ) {

                    peerConnection
                      .addIceCandidate(
                        candidate
                      );

                  }
                  else {

                    pendingCandidates.push(
                      candidate
                    );

                  }

                }

              });

          }
        );


        setStatus(
          "connecting",
          "Waiting for other phone..."
        );


        alert(
          "Call created!\n\nSend this Room Code to the other phone:\n\n" +
          currentRoom
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "failed",
          "Camera/Microphone error"
        );

        alert(
          "Camera/Microphone error:\n" +
          error.message
        );

        startBtn.disabled = false;

      }

    };


  /* =========================================
     JOIN CALL
  ========================================= */

  joinBtn.onclick =
    async () => {

      try {

        joinBtn.disabled = true;

        const code =
          roomInput.value.trim();


        if (!code) {

          alert(
            "Room Code राख्नुहोस्।"
          );

          joinBtn.disabled = false;

          return;

        }


        setStatus(
          "connecting",
          "Joining call..."
        );


        await startCamera();


        currentRoom =
          code;


        const roomRef =
          doc(
            db,
            "rooms",
            code
          );


        const roomSnapshot =
          await getDoc(roomRef);


        if (!roomSnapshot.exists()) {

          alert(
            "Room भेटिएन। सही Room Code राख्नुहोस्।"
          );

          hangUp();

          return;

        }


        const roomData =
          roomSnapshot.data();


        const calleeCandidates =
          collection(
            roomRef,
            "calleeCandidates"
          );


        /* ICE candidates */

        peerConnection.onicecandidate =
          async event => {

            if (event.candidate) {

              await addDoc(
                calleeCandidates,
                event.candidate.toJSON()
              );

            }

          };


        /* Set offer */

        await peerConnection
          .setRemoteDescription(

            new RTCSessionDescription(
              roomData.offer
            )

          );


        /* Create answer */

        const answer =
          await peerConnection.createAnswer();


        await peerConnection
          .setLocalDescription(
            answer
          );


        /* Save answer */

        await updateDoc(
          roomRef,
          {

            answer: {

              type: answer.type,

              sdp: answer.sdp

            }

          }
        );


        /* Caller ICE */

        const callerCandidates =
          collection(
            roomRef,
            "callerCandidates"
          );


        onSnapshot(
          callerCandidates,
          snapshot => {

            snapshot.docChanges()
              .forEach(change => {

                if (
                  change.type === "added"
                ) {

                  const candidate =
                    new RTCIceCandidate(
                      change.doc.data()
                    );


                  peerConnection
                    .addIceCandidate(
                      candidate
                    )
                    .catch(error => {

                      console.log(
                        "ICE candidate error:",
                        error
                      );

                    });

                }

              });

          }
        );


        roomCode.innerText =
          "Room Code: " + currentRoom;


        setStatus(
          "connecting",
          "Waiting for video connection..."
        );


        alert(
          "Joined the call!"
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "failed",
          "Join failed"
        );

        alert(
          "Join error:\n" +
          error.message
        );

        joinBtn.disabled = false;

      }

    };


  /* =========================================
     HANG UP
  ========================================= */

  function hangUp() {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(track => {

          track.stop();

        });

    }


    if (peerConnection) {

      peerConnection.close();

    }


    localStream = null;

    remoteStream = null;

    peerConnection = null;

    pendingCandidates = [];


    localVideo.srcObject =
      null;

    remoteVideo.srcObject =
      null;


    roomCode.innerText =
      "";


    roomInput.value =
      "";


    startBtn.disabled =
      false;

    joinBtn.disabled =
      false;


    setStatus(
      "disconnected",
      "Call ended"
    );

  }


  hangupBtn.onclick =
    hangUp;


  /* =========================================
     INITIAL STATUS
  ========================================= */

  setStatus(
    "ready",
    "Ready"
  );

</script>

</body>
</html>
