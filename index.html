
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravi Video Call</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0d1820;
  color:white;
  text-align:center;
  padding:20px;
}
h1{font-size:38px}
.box{
  background:white;
  color:#222;
  padding:15px;
  border-radius:15px;
  width:90%;
  max-width:500px;
  margin:15px auto;
  font-size:20px;
}
input{
  width:90%;
  padding:18px;
  border:0;
  border-radius:15px;
  font-size:18px;
  margin:10px;
}
button{
  padding:16px 25px;
  border:0;
  border-radius:15px;
  font-size:19px;
  font-weight:bold;
  margin:8px;
  background:#20c55a;
  color:white;
}
.end{background:#ef3b3b}
video{
  width:95%;
  max-width:500px;
  background:black;
  border-radius:15px;
  margin:10px;
}
#status{
  color:#7cffaa;
  font-size:20px;
  margin:15px;
}
</style>
</head>

<body>

<h1>📹 Ravi Video Call</h1>

<div>Your Call ID:</div>
<div class="box" id="myId">Connecting...</div>

<button onclick="copyId()">Copy Call ID</button>

<hr>

<div>Enter friend's Call ID:</div>

<input id="friendId" placeholder="Friend's Call ID">

<br>

<button onclick="startCall()">📞 Start Video Call</button>
<button class="end" onclick="endCall()">❌ End Call</button>

<div id="status">Starting...</div>

<h2>Your Camera</h2>
<video id="localVideo" autoplay muted playsinline></video>

<h2>Friend's Camera</h2>
<video id="remoteVideo" autoplay playsinline></video>

<script>

let peer;
let localStream;
let currentCall;

async function startCamera(){

  try{

    localStream = await navigator.mediaDevices.getUserMedia({
      video:true,
      audio:true
    });

    document.getElementById("localVideo").srcObject = localStream;

    document.getElementById("status").innerText =
      "Camera ready. Your Call ID is loading...";

    createPeer();

  }catch(error){

    document.getElementById("status").innerText =
      "Camera/Microphone permission Allow गर्नुहोस्.";

    alert("Camera र Microphone permission Allow गर्नुहोस्।");
  }
}

function createPeer(){

  peer = new Peer();

  peer.on("open", function(id){

    document.getElementById("myId").innerText = id;

    document.getElementById("status").innerText =
      "Ready! अब Call ID share गर्नुहोस्।";
  });

  peer.on("call", function(call){

    currentCall = call;

    call.answer(localStream);

    call.on("stream", function(remoteStream){

      document.getElementById("remoteVideo").srcObject =
        remoteStream;

      document.getElementById("status").innerText =
        "📞 Video Call Connected!";
    });
  });

  peer.on("error", function(error){

    document.getElementById("status").innerText =
      "Connection error: " + error.type;
  });
}

function startCall(){

  let friendId =
    document.getElementById("friendId").value.trim();

  if(!friendId){
    alert("Friend's Call ID हाल्नुहोस्।");
    return;
  }

  if(!localStream){
    alert("Camera सुरु भएको छैन।");
    return;
  }

  currentCall = peer.call(friendId, localStream);

  document.getElementById("status").innerText =
    "Calling...";

  currentCall.on("stream", function(remoteStream){

    document.getElementById("remoteVideo").srcObject =
      remoteStream;

    document.getElementById("status").innerText =
      "📞 Video Call Connected!";
  });
}

function copyId(){

  let id = document.getElementById("myId").innerText;

  if(id && id !== "Connecting..."){

    navigator.clipboard.writeText(id);

    alert("Call ID copied!");
  }
}

function endCall(){

  if(currentCall){
    currentCall.close();
  }

  document.getElementById("remoteVideo").srcObject = null;

  document.getElementById("status").innerText =
    "Call ended.";
}

startCamera();

</script>

</body>
  </html>
