<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ravi Live</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  height:100vh;
  position:relative;
  background:#111;
}

video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

#remoteVideo{z-index:1}
#localVideo{
  z-index:5;
  width:105px;
  height:150px;
  right:12px;
  top:75px;
  border-radius:15px;
  border:2px solid #fff;
  object-fit:cover;
}

.top{
  position:absolute;
  z-index:10;
  top:0;
  left:0;
  right:0;
  padding:18px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(#000b,transparent);
}

.profile{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#e91e63;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.name{
  font-weight:bold;
}

.online{
  color:#4ade80;
  font-size:12px;
}

#status{
  padding:7px 11px;
  border-radius:20px;
  background:#f59e0b;
  font-size:12px;
  font-weight:bold;
}

.bottom{
  position:absolute;
  z-index:10;
  left:0;
  right:0;
  bottom:0;
  padding:15px 12px 25px;
  background:linear-gradient(transparent,#000e);
}

.room{
  text-align:center;
  margin-bottom:12px;
  color:#ffd54a;
  font-weight:bold;
  word-break:break-all;
}

input{
  width:100%;
  padding:14px;
  border:0;
  border-radius:25px;
  margin-bottom:10px;
  font-size:16px;
  outline:none;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:50%;
  width:52px;
  height:52px;
  font-size:20px;
  color:#fff;
  background:#333;
  cursor:pointer;
}

.start{
  background:#16a34a;
  border-radius:28px;
  width:auto;
  padding:0 22px;
  font-size:15px;
}

.join{
  background:#2563eb;
  border-radius:28px;
  width:auto;
  padding:0 22px;
  font-size:15px;
}

.end{
  background:#dc2626;
}

#message{
  text-align:center;
  font-size:13px;
  margin-bottom:8px;
  color:#ddd;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div id="app">

  <video id="remoteVideo" autoplay playsinline></video>

  <video id="localVideo" autoplay muted playsinline></video>

  <div class="top">

    <div class="profile">

      <div class="avatar">R</div>

      <div>
        <div class="name">Ravi Live</div>
        <div class="online">● Online</div>
      </div>

    </div>

    <div id="status">Ready</div>

  </div>


  <div class="bottom">

    <div id="message">
      📹 Start your live video call
    </div>

    <div id="room" class="room"></div>

    <input
      id="roomInput"
      placeholder="Enter Call ID"
      autocomplete="off"
    >

    <div class="buttons">

      <button
        id="startBtn"
        class="start">
        📞 Start
      </button>

      <button
        id="joinBtn"
        class="join">
        📲 Join
      </button>

      <button id="muteBtn">
        🎤
      </button>

      <button id="cameraBtn">
        📷
      </button>

      <button id="switchBtn">
        🔄
      </button>

      <button
        id="endBtn"
        class="end">
        ☎
      </button>

    </div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  collection,
  addDoc,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig={

apiKey:
"AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

authDomain:
"ravi-video-call-fa15d.firebaseapp.com",

projectId:
"ravi-video-call-fa15d",

storageBucket:
"ravi-video-call-fa15d.firebasestorage.app",

messagingSenderId:
"1079442344769",

appId:
"1:1079442344769:web:d7812efaf277c3f6d4efc0",

measurementId:
"G-69RY93XC91"

};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const localVideo=
document.getElementById("localVideo");

const remoteVideo=
document.getElementById("remoteVideo");

const startBtn=
document.getElementById("startBtn");

const joinBtn=
document.getElementById("joinBtn");

const endBtn=
document.getElementById("endBtn");

const muteBtn=
document.getElementById("muteBtn");

const cameraBtn=
document.getElementById("cameraBtn");

const switchBtn=
document.getElementById("switchBtn");

const roomInput=
document.getElementById("roomInput");

const room=
document.getElementById("room");

const status=
document.getElementById("status");

const message=
document.getElementById("message");


/* =========================
   VARIABLES
========================= */

let localStream=null;
let remoteStream=null;
let peer=null;
let currentRoom=null;

let muted=false;
let cameraOff=false;
let facingMode="user";


/* =========================
   WEBRTC
========================= */

const servers={

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
},

{
urls:
"stun:stun1.l.google.com:19302"
}

]

};


/* =========================
   STATUS
========================= */

function setStatus(text){

status.innerText=text;

if(text.includes("Connected")){
status.style.background="#16a34a";
}

else if(text.includes("Failed")){
status.style.background="#dc2626";
}

else if(text.includes("Connecting")){
status.style.background="#f59e0b";
}

else{
status.style.background="#475569";
}

}


/* =========================
   CAMERA
========================= */

async function startCamera(){

localStream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:facingMode
},

audio:true

});

localVideo.srcObject=
localStream;


remoteStream=
new MediaStream();

remoteVideo.srcObject=
remoteStream;


peer=
new RTCPeerConnection(servers);


localStream
.getTracks()
.forEach(track=>{

peer.addTrack(
track,
localStream
);

});


peer.ontrack=
event=>{

event.streams[0]
.getTracks()
.forEach(track=>{

remoteStream.addTrack(track);

});

remoteVideo.srcObject=
remoteStream;

};


peer.onconnectionstatechange=
()=>{

const s=
peer.connectionState;

if(s==="connecting"){

setStatus("Connecting...");

message.innerText=
"📡 Connecting to other phone...";

}

else if(s==="connected"){

setStatus("🟢 Connected");

message.innerText=
"🎥 Live call connected";

}

else if(s==="disconnected"){

setStatus("Disconnected");

message.innerText=
"Phone disconnected";

}

else if(s==="failed"){

setStatus("❌ Failed");

message.innerText=
"Connection failed";

}

};

}


/* =========================
   CREATE CALL
========================= */

startBtn.onclick=
async()=>{

try{

await startCamera();

setStatus("Connecting...");


const roomRef=
doc(collection(db,"rooms"));

currentRoom=
roomRef.id;


const callerCandidates=
collection(
roomRef,
"callerCandidates"
);

const calleeCandidates=
collection(
roomRef,
"calleeCandidates"
);


peer.onicecandidate=
async event=>{

if(event.candidate){

await addDoc(
callerCandidates,
event.candidate.toJSON()
);

}

};


const offer=
await peer.createOffer();

await peer.setLocalDescription(
offer
);


await setDoc(
roomRef,
{

offer:{
type:offer.type,
sdp:offer.sdp
}

}
);


room.innerText=
"Call ID: "+currentRoom;


message.innerText=
"📲 Send this Call ID to your friend";


onSnapshot(
roomRef,
async snap=>{

const data=snap.data();

if(
data &&
data.answer &&
!peer.currentRemoteDescription
){

await peer.setRemoteDescription(

new RTCSessionDescription(
data.answer
)

);

}

}
);


onSnapshot(
calleeCandidates,
snap=>{

snap.docChanges()
.forEach(change=>{

if(
change.type==="added"
){

peer.addIceCandidate(

new RTCIceCandidate(
change.doc.data()
)

);

}

});

}
);


}catch(error){

alert(
"Error: "+error.message
);

}

};


/* =========================
   JOIN CALL
========================= */

joinBtn.onclick=
async()=>{

try{

const code=
roomInput.value.trim();

if(!code){

alert(
"Call ID राख्नुहोस्"
);

return;

}


await startCamera();

setStatus("Connecting...");


const roomRef=
doc(db,"rooms",code);

const snap=
await getDoc(roomRef);


if(!snap.exists()){

alert(
"Call ID भेटिएन"
);

return;

}


const data=
snap.data();


const callerCandidates=
collection(
roomRef,
"callerCandidates"
);

const calleeCandidates=
collection(
roomRef,
"calleeCandidates"
);


peer.onicecandidate=
async event=>{

if(event.candidate){

await addDoc(
calleeCandidates,
event.candidate.toJSON()
);

}

};


await peer.setRemoteDescription(

new RTCSessionDescription(
data.offer
)

);


const answer=
await peer.createAnswer();

await peer.setLocalDescription(
answer
);


await updateDoc(
roomRef,
{

answer:{
type:answer.type,
sdp:answer.sdp
}

}
);


onSnapshot(
callerCandidates,
snap=>{

snap.docChanges()
.forEach(change=>{

if(
change.type==="added"
){

peer.addIceCandidate(

new RTCIceCandidate(
change.doc.data()
)

);

}

});

}
);


room.innerText=
"Call ID: "+code;


}catch(error){

alert(
"Join Error: "+error.message
);

}

};


/* =========================
   MUTE
========================= */

muteBtn.onclick=()=>{

if(!localStream)
return;

const track=
localStream.getAudioTracks()[0];

if(!track)
return;

muted=!muted;

track.enabled=!muted;

muteBtn.innerText=
muted ? "🔇" : "🎤";

};


/* =========================
   CAMERA ON/OFF
========================= */

cameraBtn.onclick=()=>{

if(!localStream)
return;

const track=
localStream.getVideoTracks()[0];

if(!track)
return;

cameraOff=!cameraOff;

track.enabled=!cameraOff;

cameraBtn.innerText=
cameraOff ? "🚫" : "📷";

};


/* =========================
   SWITCH CAMERA
========================= */

switchBtn.onclick=
async()=>{

if(!localStream)
return;

facingMode=
facingMode==="user"
? "environment"
: "user";


const newStream=
await navigator.mediaDevices
.getUserMedia({

video:{
facingMode:facingMode
},

audio:false

});


const newTrack=
newStream.getVideoTracks()[0];


const sender=
peer
.getSenders()
.find(
s=>s.track &&
s.track.kind==="video"
);


if(sender){

await sender.replaceTrack(
newTrack
);

}


const oldTrack=
localStream.getVideoTracks()[0];

oldTrack.stop();

localStream.removeTrack(
oldTrack
);

localStream.addTrack(
newTrack
);

localVideo.srcObject=
localStream;

};


/* =========================
   END CALL
========================= */

endBtn.onclick=()=>{

if(localStream){

localStream
.getTracks()
.forEach(track=>{
track.stop();
});

}

if(peer){

peer.close();

}

localStream=null;
remoteStream=null;
peer=null;

localVideo.srcObject=null;
remoteVideo.srcObject=null;

room.innerText="";

setStatus("Ready");

message.innerText=
"📹 Start your live video call";

};

</script>

</body>
</html>
