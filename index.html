<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ravi Chat</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  background:#000;
}

video{
  position:absolute;
  background:#111;
  object-fit:cover;
}

#remoteVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#050505;
  object-fit:cover;
}

#localVideo{
  position:absolute;
  top:70px;
  right:12px;
  width:110px;
  height:155px;
  border:2px solid #fff;
  border-radius:15px;
  z-index:5;
  background:#111;
  object-fit:cover;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  padding:17px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#000f,transparent);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

#status{
  padding:8px 14px;
  border-radius:20px;
  background:#475569;
  font-size:13px;
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  text-align:center;
  padding:18px 10px 28px;
  background:linear-gradient(transparent,#000f);
}

#message{
  margin-bottom:14px;
  font-size:15px;
}

.buttons{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  padding:13px 18px;
  border-radius:25px;
  cursor:pointer;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

#startBtn{
  background:#16a34a;
}

#nextBtn{
  background:#2563eb;
}

#endBtn{
  background:#dc2626;
}

#giftBtn{
  background:#db2777;
}

.small{
  width:50px;
  height:50px;
  padding:0;
  border-radius:50%;
  background:#333;
}

#giftBox{
  display:none;
  position:absolute;
  bottom:105px;
  left:50%;
  transform:translateX(-50%);
  z-index:50;
  width:280px;
  padding:15px;
  border-radius:20px;
  background:#202020;
  box-shadow:0 10px 30px #000;
}

#giftBox h3{
  margin:5px 0 15px;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gift{
  background:#333;
  border-radius:15px;
  padding:12px 5px;
  cursor:pointer;
  font-size:25px;
  text-align:center;
  user-select:none;
}

.gift:hover{
  background:#444;
}

#giftAnimation{
  display:none;
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:100;
  font-size:90px;
  animation:pop .8s ease;
  pointer-events:none;
}

#connecting{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:15;
  text-align:center;
  pointer-events:none;
}

.spinner{
  width:78px;
  height:78px;
  border:7px solid #444;
  border-top:7px solid #fff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}

.connectText{
  margin-top:18px;
  font-size:18px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

@keyframes pop{

  0%{
    transform:translate(-50%,-50%) scale(.2);
  }

  70%{
    transform:translate(-50%,-50%) scale(1.3);
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
  }

}

@media(max-width:500px){

  #localVideo{
    width:105px;
    height:150px;
    top:65px;
    right:10px;
  }

  .logo{
    font-size:19px;
  }

  #status{
    font-size:12px;
    padding:7px 12px;
  }

  button{
    font-size:14px;
    padding:12px 16px;
  }

  .small{
    width:48px;
    height:48px;
  }

}

</style>
</head>

<body>

<div id="app">

  <!-- REMOTE VIDEO -->
  <video

  </video>

      <div class="gift" data-gift="🎉">🎉</div>

      <div class="gift" data-gift="💎">💎</div>
      <div class="gift" data-gift="🔥">🔥</div>

  <div class="bottom">

      <button

        disabled>

      </button>

      <button

        class="small"
        disabled>

      </button>

      <button
        id="giftBtn"
        disabled>
        🎁 Gift
      </button>

      <button
        id="endBtn"
        disabled>
        ☎ End
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     METERED SDK
===================================================== -->

<script src="https://cdn.metered.ca/sdk/video/1.4.6/sdk.min.js"></script>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  deleteDoc,
  collection,
  query,
  where,
  limit,
  getDocs,
  onSnapshot,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

  authDomain:
    "ravi-video-call-fa15d.firebaseapp.com",

  projectId:
    "ravi-video-call-fa15d",

  storageBucket:
    "ravi-video-call-fa15d.firebasestorage.app",

  messagingSenderId:
    "1079442344769",

  appId:
    "1:1079442344769:web:d7812efaf277c3f6d4efc0",

  measurementId:
    "G-69RY93XC91"

};


const firebaseApp =
  initializeApp(firebaseConfig);

const db =
  getFirestore(firebaseApp);


/* =====================================================
   METERED CONFIG
===================================================== */

/*
   IMPORTANT:

   This MUST match your Metered application domain.

   Your Vercel API uses:
   METERED_DOMAIN

   Example:

   METERED_DOMAIN =
   ravi-video-call.metered.live
*/

const METERED_DOMAIN =
  "ravi-video-call.metered.live";


const CREATE_ROOM_API =
  "/api/create-room";


/* =====================================================
   ELEMENTS
===================================================== */

const localVideo =
  document.getElementById(
    "localVideo"
  );

const remoteVideo =
  document.getElementById(
    "remoteVideo"
  );

const startBtn =
  document.getElementById(
    "startBtn"
  );

const nextBtn =
  document.getElementById(
    "nextBtn"
  );

const endBtn =
  document.getElementById(
    "endBtn"
  );

const muteBtn =
  document.getElementById(
    "muteBtn"
  );

const cameraBtn =
  document.getElementById(
    "cameraBtn"
  );

const giftBtn =
  document.getElementById(
    "giftBtn"
  );

const giftBox =
  document.getElementById(
    "giftBox"
  );

const giftAnimation =
  document.getElementById(
    "giftAnimation"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const messageEl =
  document.getElementById(
    "message"
  );

const connectingEl =
  document.getElementById(
    "connecting"
  );


/* =====================================================
   STATE
===================================================== */

const userId =
  crypto.randomUUID();

let meeting =
  null;

let queueListener =
  null;

let giftListener =
  null;

let currentRoom =
  null;

let currentPartner =
  null;

let localStream =
  null;

let remoteStream =
  null;

let muted =
  false;

let cameraOff =
  false;

let busy =
  false;


/* =====================================================
   UI
===================================================== */

function setStatus(text){

  statusEl.innerText =
    text;


  if(
    text.includes("Connected") ||
    text.includes("Online")
  ){

    statusEl.style.background =
      "#16a34a";

  }
  else if(
    text.includes("Searching") ||
    text.includes("Connecting")
  ){

    statusEl.style.background =
      "#f59e0b";

  }
  else{

    statusEl.style.background =
      "#475569";

  }

}


function setMessage(text){

  messageEl.innerText =
    text;

}


function showConnecting(show){

  connectingEl.style.display =
    show ? "block" : "none";

}


function enableCallButtons(enabled){

  nextBtn.disabled =
    !enabled;

  endBtn.disabled =
    !enabled;

  muteBtn.disabled =
    !enabled;

  cameraBtn.disabled =
    !enabled;

  giftBtn.disabled =
    !enabled;

}


/* =====================================================
   ENTER QUEUE
===================================================== */

async function enterQueue(){

  const queueRef =
    doc(
      db,
      "matchQueue",
      userId
    );


  await setDoc(
    queueRef,
    {

      userId:
        userId,

      state:
        "waiting",

      partner:
        null,

      roomId:
        null,

      createdAt:
        serverTimestamp()

    }
  );

}


/* =====================================================
   FIND PARTNER
===================================================== */

async function findPartner(){

  const q =
    query(
      collection(
        db,
        "matchQueue"
      ),

      where(
        "state",
        "==",
        "waiting"
      ),

      limit(10)
    );


  const snapshot =
    await getDocs(q);


  for(
    const candidate
    of snapshot.docs
  ){

    const partnerId =
      candidate.data().userId;


    if(
      partnerId === userId
    ){

      continue;

    }


    const myRef =
      doc(
        db,
        "matchQueue",
        userId
      );


    const partnerRef =
      doc(
        db,
        "matchQueue",
        partnerId
      );


    const roomId =
      "ravi-" +
      crypto.randomUUID()
        .replaceAll("-", "")
        .substring(0,12);


    try{

      const success =
        await runTransaction(
          db,
          async(transaction)=>{

            const me =
              await transaction.get(
                myRef
              );

            const partner =
              await transaction.get(
                partnerRef
              );


            if(
              !me.exists() ||
              !partner.exists()
            ){

              return false;

            }


            const meData =
              me.data();

            const partnerData =
              partner.data();


            if(
              meData.state !==
              "waiting"
            ){

              return false;

            }


            if(
              partnerData.state !==
              "waiting"
            ){

              return false;

            }


            transaction.update(
              myRef,
              {

                state:
                  "matched",

                partner:
                  partnerId,

                roomId:
                  roomId

              }
            );


            transaction.update(
              partnerRef,
              {

                state:
                  "matched",

                partner:
                  userId,

                roomId:
                  roomId

              }
            );


            return true;

          }
        );


      if(success){

        currentRoom =
          roomId;

        currentPartner =
          partnerId;

        return true;

      }

    }
    catch(error){

      console.log(
        "Match transaction:",
        error
      );

    }

  }


  return false;

}


/* =====================================================
   LISTEN FOR MATCH
===================================================== */

function listenForMatch(){

  if(queueListener){

    queueListener();

    queueListener =
      null;

  }


  queueListener =
    onSnapshot(

      doc(
        db,
        "matchQueue",
        userId
      ),

      async(snapshot)=>{

        if(
          !snapshot.exists()
        ){

          return;

        }


        const data =
          snapshot.data();


        if(
          data.state ===
            "matched" &&
          data.roomId
        ){

          if(
            meeting &&
            currentRoom ===
              data.roomId
          ){

            return;

          }


          currentRoom =
            data.roomId;

          currentPartner =
            data.partner;


          console.log(
            "MATCH FOUND:",
            data
          );


          setStatus(
            "Connecting..."
          );


          setMessage(
            "🎉 Partner found! Connecting..."
          );


          showConnecting(
            true
          );


          await connectMetered(
            data.roomId
          );

        }

      },

      error => {

        console.error(
          "Queue listener error:",
          error
        );

      }

    );

}


/* =====================================================
   CREATE METERED ROOM
===================================================== */

async function createMeteredRoom(roomId){

  const response =
    await fetch(
      CREATE_ROOM_API,
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            roomName:
              roomId

          })

      }
    );


  const text =
    await response.text();


  let data = {};


  try{

    data =
      text
        ? JSON.parse(text)
        : {};

  }
  catch{

    data = {
      raw:
        text
    };

  }


  console.log(
    "Create room response:",
    response.status,
    data
  );


  if(
    !response.ok
  ){

    throw new Error(
      data.error ||
      "Metered room creation failed"
    );

  }


  return data;

}


/* =====================================================
   LOCAL TRACK
===================================================== */

function handleLocalTrack(item){

  if(
    !item ||
    !item.track
  ){

    return;

  }


  if(
    !localStream
  ){

    localStream =
      new MediaStream();

  }


  const exists =
    localStream
      .getTracks()
      .some(
        track =>
          track.id ===
          item.track.id
      );


  if(!exists){

    localStream.addTrack(
      item.track
    );

  }


  localVideo.srcObject =
    localStream;


  localVideo
    .play()
    .catch(
      error =>
        console.log(
          "Local video:",
          error
        )
    );

}


/* =====================================================
   REMOTE TRACK
===================================================== */

function handleRemoteTrack(item){

  if(
    !item ||
    !item.track
  ){

    return;

  }


  if(
    !remoteStream
  ){

    remoteStream =
      new MediaStream();

  }


  const exists =
    remoteStream
      .getTracks()
      .some(
        track =>
          track.id ===
          item.track.id
      );


  if(!exists){

    remoteStream.addTrack(
      item.track
    );

  }


  remoteVideo.srcObject =
    remoteStream;


  remoteVideo
    .play()
    .catch(
      error =>
        console.log(
          "Remote video:",
          error
        )
    );


  showConnecting(
    false
  );


  setStatus(
    "🟢 Connected"
  );


  setMessage(
    "🎥 Video chat connected"
  );


  enableCallButtons(
    true
  );

}


/* =====================================================
   METERED CONNECT
===================================================== */

async function connectMetered(roomId){

  let timeoutId =
    null;


  try{

    if(
      !window.Metered ||
      !window.Metered.Meeting
    ){

      throw new Error(
        "Metered SDK did not load"
      );

    }


    setStatus(
      "Connecting..."
    );


    setMessage(
      "📡 Joining video room..."
    );


    showConnecting(
      true
    );


    /*
       Reset old streams.
    */

    localStream =
      null;

    remoteStream =
      null;

    localVideo.srcObject =
      null;

    remoteVideo.srcObject =
      null;


    /*
       Make sure the room exists.
    */

    await createMeteredRoom(
      roomId
    );


    /*
       IMPORTANT:
       Metered room URL.
    */

    const roomURL =
      METERED_DOMAIN +
      "/" +
      roomId;


    console.log(
      "Joining Metered room:",
      roomURL
    );


    /*
       Create Meeting.
    */

    meeting =
      new Metered.Meeting();


    /* -----------------------------------------------
       LOCAL TRACK
    ----------------------------------------------- */

    meeting.on(
      "localTrackStarted",
      item => {

        console.log(
          "LOCAL TRACK:",
          item
        );


        handleLocalTrack(
          item
        );

      }
    );


    /* -----------------------------------------------
       REMOTE TRACK
    ----------------------------------------------- */

    meeting.on(
      "remoteTrackStarted",
      item => {

        console.log(
          "REMOTE TRACK:",
          item
        );


        handleRemoteTrack(
          item
        );

      }
    );


    /* -----------------------------------------------
       PARTICIPANT JOINED
    ----------------------------------------------- */

    meeting.on(
      "participantJoined",
      info => {

        console.log(
          "PARTICIPANT JOINED:",
          info
        );


        setStatus(
          "🟢 Connected"
        );


        setMessage(
          "🎥 Partner connected"
        );

      }
    );


    /* -----------------------------------------------
       PARTICIPANT LEFT
    ----------------------------------------------- */

    meeting.on(
      "participantLeft",
      info => {

        console.log(
          "PARTICIPANT LEFT:",
          info
        );


        remoteStream =
          null;

        remoteVideo.srcObject =
          null;


        showConnecting(
          false
        );


        setStatus(
          "Online"
        );


        setMessage(
          "👋 Partner left. Press Next."
        );


        enableCallButtons(
          true
        );

      }
    );


    /* -----------------------------------------------
       JOIN WITH TIMEOUT
    ----------------------------------------------- */

    const joinPromise =
      meeting.join({

        roomURL:
          roomURL,

        name:
          "Ravi-" +
          userId.substring(
            0,
            8
          )

      });


    const timeoutPromise =
      new Promise(
        (_,reject)=>{

          timeoutId =
            setTimeout(
              ()=>{

                reject(
                  new Error(
                    "Metered join timed out. Check METERED_DOMAIN and Metered room."
                  )
                );

              },
              25000
            );

        }
      );


    const meetingInfo =
      await Promise.race([
        joinPromise,
        timeoutPromise
      ]);


    if(timeoutId){

      clearTimeout(
        timeoutId
      );

    }


    console.log(
      "METERED JOINED:",
      meetingInfo
    );


    /*
       Start camera.
    */

    await meeting.startVideo();


    /*
       Start microphone.
    */

    await meeting.startAudio();


    /*
       Connected to room.
    */

    setStatus(
      "🟢 Connected"
    );


    setMessage(
      "🎥 Video room joined"
    );


    enableCallButtons(
      true
    );


    showConnecting(
      false
    );


    /*
       Gift listener.
    */

    listenForGifts(
      roomId
    );


  }
  catch(error){

    if(timeoutId){

      clearTimeout(
        timeoutId
      );

    }


    console.error(
      "METERED CONNECTION ERROR:",
      error
    );


    showConnecting(
      false
    );


    await leaveMeeting();


    enableCallButtons(
      false
    );


    setStatus(
      "Offline"
    );


    setMessage(
      "❌ Connection failed"
    );


    alert(
      "Video connection failed:\n\n" +
      error.message +
      "\n\nRoom: " +
      roomId
    );

  }

}


/* =====================================================
   START
===================================================== */

async function start(){

  if(busy){

    return;

  }


  busy =
    true;

  startBtn.disabled =
    true;


  try{

    setStatus(
      "Online"
    );


    setMessage(
      "🎥 Starting..."
    );


    await enterQueue();


    listenForMatch();


    const found =
      await findPartner();


    if(found){

      setStatus(
        "Connecting..."
      );


      setMessage(
        "🎉 Partner found! Connecting..."
      );

    }
    else{

      setStatus(
        "Searching..."
      );


      setMessage(
        "🔎 Waiting for a random partner..."
      );

    }

  }
  catch(error){

    console.error(
      "START ERROR:",
      error
    );


    setStatus(
      "Offline"
    );


    setMessage(
      "❌ Start failed"
    );


    startBtn.disabled =
      false;

  }


  busy =
    false;

}


/* =====================================================
   NEXT
===================================================== */

async function next(){

  if(busy){

    return;

  }


  busy =
    true;


  try{

    setMessage(
      "⏭ Finding another partner..."
    );


    setStatus(
      "Searching..."
    );


    showConnecting(
      false
    );


    await leaveMeeting();


    currentRoom =
      null;

    currentPartner =
      null;


    await enterQueue();


    listenForMatch();


    const found =
      await findPartner();


    if(found){

      setStatus(
        "Connecting..."
      );


      setMessage(
        "🎉 Partner found! Connecting..."
      );

    }
    else{

      setMessage(
        "🔎 Waiting for another partner..."
      );

    }

  }
  catch(error){

    console.error(
      "NEXT ERROR:",
      error
    );


    setStatus(
      "Offline"
    );


    setMessage(
      "❌ Next failed"
    );

  }


  busy =
    false;

}


/* =====================================================
   LEAVE MEETING
===================================================== */

async function leaveMeeting(){

  try{

    if(meeting){

      if(
        typeof meeting.leaveMeeting ===
        "function"
      ){

        await meeting.leaveMeeting();

      }
      else if(
        typeof meeting.leave ===
        "function"
      ){

        await meeting.leave();

      }

    }

  }
  catch(error){

    console.log(
      "Leave error:",
      error
    );

  }


  meeting =
    null;


  localStream =
    null;

  remoteStream =
    null;


  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;


  if(giftListener){

    giftListener();

    giftListener =
      null;

  }


  muted =
    false;

  cameraOff =
    false;


  muteBtn.innerText =
    "🎤";

  cameraBtn.innerText =
    "📷";

}


/* =====================================================
   END
===================================================== */

async function endCall(){

  if(busy){

    return;

  }


  await leaveMeeting();


  if(queueListener){

    queueListener();

    queueListener =
      null;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "matchQueue",
        userId
      )
    );

  }
  catch(error){

    console.log(
      "Queue delete:",
      error
    );

  }


  currentRoom =
    null;

  currentPartner =
    null;


  enableCallButtons(
    false
  );


  startBtn.disabled =
    false;


  showConnecting(
    false
  );


  setStatus(
    "Offline"
  );


  setMessage(
    "Press Start to begin"
  );

}


/* =====================================================
   MUTE
===================================================== */

muteBtn.onclick =
async function(){

  if(!meeting){

    return;

  }


  try{

    if(!muted){

      await meeting.stopAudio();

      muted =
        true;

      muteBtn.innerText =
        "🔇";

    }
    else{

      await meeting.startAudio();

      muted =
        false;

      muteBtn.innerText =
        "🎤";

    }

  }
  catch(error){

    console.log(
      "Mute error:",
      error
    );

  }

};


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.onclick =
async function(){

  if(!meeting){

    return;

  }


  try{

    if(!cameraOff){

      await meeting.stopVideo();

      cameraOff =
        true;

      cameraBtn.innerText =
        "🚫";

    }
    else{

      await meeting.startVideo();

      cameraOff =
        false;

      cameraBtn.innerText =
        "📷";

    }

  }
  catch(error){

    console.log(
      "Camera error:",
      error
    );

  }

};


/* =====================================================
   GIFT MENU
===================================================== */

giftBtn.onclick =
function(){

  if(
    giftBox.style.display ===
    "block"
  ){

    giftBox.style.display =
      "none";

  }
  else{

    giftBox.style.display =
      "block";

  }

};


/* =====================================================
   SEND GIFT
===================================================== */

document
  .querySelectorAll(".gift")
  .forEach(
    button => {

      button.onclick =
      async function(){

        const gift =
          button.dataset.gift;


        giftBox.style.display =
          "none";


        showGift(
          gift
        );


        if(
          currentRoom &&
          currentPartner
        ){

          try{

            await setDoc(

              doc(
                collection(
                  db,
                  "rooms",
                  currentRoom,
                  "gifts"
                )
              ),

              {

                from:
                  userId,

                to:
                  currentPartner,

                gift:
                  gift,

                createdAt:
                  serverTimestamp()

              }

            );

          }
          catch(error){

            console.log(
              "Gift error:",
              error
            );

          }

        }

      };

    }
  );


/* =====================================================
   SHOW GIFT
===================================================== */

function showGift(gift){

  giftAnimation.innerText =
    gift;


  giftAnimation.style.display =
    "block";


  setTimeout(
    ()=>{

      giftAnimation.style.display =
        "none";

    },
    1000
  );

}


/* =====================================================
   RECEIVE GIFTS
===================================================== */

function listenForGifts(roomId){

  if(giftListener){

    giftListener();

    giftListener =
      null;

  }


  giftListener =
    onSnapshot(

      collection(
        db,
        "rooms",
        roomId,
        "gifts"
      ),

      snapshot => {

        snapshot
          .docChanges()
          .forEach(
            change => {

              if(
                change.type ===
                "added"
              ){

                const data =
                  change.doc.data();


                if(
                  data.to ===
                  userId
                ){

                  showGift(
                    data.gift
                  );

                }

              }

            }
          );

      },

      error => {

        console.log(
          "Gift listener:",
          error
        );

      }

    );

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

startBtn.onclick =
  start;

nextBtn.onclick =
  next;

endBtn.onclick =
  endCall;


/* =====================================================
   INITIAL STATE
===================================================== */

setStatus(
  "Offline"
);

setMessage(
  "Press Start to begin"
);

enableCallButtons(
  false
);

showConnecting(
  false
);


console.log(
  "✅ Ravi Chat initialized"
);

console.log(
  "User ID:",
  userId
);

console.log(
  "Metered domain:",
  METERED_DOMAIN
);

</script>
