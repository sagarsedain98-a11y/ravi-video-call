/* =====================================================

===================================================== */

/*

*/

let userId =

if(!userId){

let meeting = null;

let giftListener = null;

let currentRoom = null;

let currentPartner = null;

let localStream = null;

let remoteStream = null;

let muted = false;

let cameraOff = false;

let busy = false;

let connecting = false;

let connectionTimer = null;


/* =====================================================
   UI
===================================================== */

function setStatus(text){

  statusEl.innerText =
    text;

  if(
    text.includes("Connected") ||
    text.includes("Online")
  ){

    statusEl.style.background =
      "#16a34a";

  }
  else if(
    text.includes("Searching") ||

  ){

  }
  else if(

  ){

  }

    statusEl.style.background =

}


function setMessage(text){

function showConnecting(show){

/* =====================================================
   CAMERA/MIC PERMISSION CHECK
===================================================== */

async function checkMediaPermission(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    throw new Error(
      "Camera/Microphone is not available. Please use HTTPS."
    );

  }


  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:true
      });


    /*
       Stop this temporary stream.
       Metered will request/use the camera again
       when startVideo/startAudio is called.
    */

    stream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    return true;

  }
  catch(error){

    console.error(
      "Permission error:",
      error
    );

    permissionBox.style.display =
      "block";

    throw error;

  }

}


/* =====================================================
   FIREBASE QUEUE
===================================================== */

async function enterQueue(){

  const queueRef =
    doc(
      db,
      "matchQueue",
      userId
    );


  await setDoc(
    queueRef,
    {

      userId:
        userId,

      state:
        "waiting",

      partner:
        null,

      roomId:
        null,

      createdAt:
        serverTimestamp()

    }
  );

}


/* =====================================================
   REMOVE QUEUE
===================================================== */

async function removeFromQueue(){

  try{

    await deleteDoc(
      doc(
        db,
        "matchQueue",
        userId
      )
    );

  }
  catch(error){

    console.log(
      "Queue remove:",
      error
    );

  }

}


/* =====================================================
   FIND PARTNER
===================================================== */

async function findPartner(){

  const q =
    query(
      collection(
        db,
        "matchQueue"
      ),

      where(
        "state",
        "==",
        "waiting"
      ),

      limit(20)
    );


  const snapshot =
    await getDocs(q);


  for(
    const candidate
    of snapshot.docs
  ){

    const candidateData =
      candidate.data();

    const partnerId =
      candidateData.userId;


    if(
      !partnerId ||
      partnerId === userId
    ){

      continue;

    }


    const myRef =
      doc(
        db,
        "matchQueue",
        userId
      );

    const partnerRef =
      doc(
        db,
        "matchQueue",
        partnerId
      );


    /*
       Room ID is generated once by the user
       who successfully wins the transaction.
    */

    const roomId =
      "ravi-" +
      crypto.randomUUID()
        .replaceAll("-","")
        .substring(0,12);


    let matched =
      false;


    try{

      matched =
        await runTransaction(
          db,
          async(transaction)=>{

            const me =
              await transaction.get(
                myRef
              );

            const partner =
              await transaction.get(
                partnerRef
              );


            if(
              !me.exists() ||
              !partner.exists()
            ){

              return false;

            }


            const meData =
              me.data();

            const partnerData =
              partner.data();


            if(
              meData.state !==
                "waiting" ||

              partnerData.state !==
                "waiting"
            ){

              return false;

            }


            transaction.update(
              myRef,
              {

                state:
                  "matched",

                partner:
                  partnerId,

                roomId:
                  roomId

              }
            );


            transaction.update(
              partnerRef,
              {

                state:
                  "matched",

                partner:
                  userId,

                roomId:
                  roomId

              }
            );


            return true;

          }
        );

    }
    catch(error){

      console.log(
        "Match transaction:",
        error
      );

      continue;

    }


    if(matched){

      currentRoom =
        roomId;

      currentPartner =
        partnerId;

      return true;

    }

  }


  return false;

}


/* =====================================================
   FIREBASE MATCH LISTENER
===================================================== */

function listenForMatch(){

  if(queueListener){

    queueListener();

    queueListener =
      null;

  }


  queueListener =
    onSnapshot(

      doc(
        db,
        "matchQueue",
        userId
      ),

      async(snapshot)=>{

        if(
          !snapshot.exists()
        ){

          return;

        }


        const data =
          snapshot.data();


        if(
          data.state !== "matched" ||
          !data.roomId
        ){

          return;

        }


        /*
           Ignore duplicate snapshots.
        */

        if(
          connecting &&
          currentRoom ===
            data.roomId
        ){

          return;

        }


        if(
          meeting &&
          currentRoom ===
            data.roomId
        ){

          return;

        }


        currentRoom =
          data.roomId;

        currentPartner =
          data.partner || null;


        setStatus(
          "Connecting..."
        );

        setMessage(
          "🎉 Partner found! Connecting..."
        );


        await connectMetered(
          data.roomId
        );

      },

      error => {

        console.error(
          "Queue listener error:",
          error
        );

        setStatus(
          "Offline"
        );

        setMessage(
          "❌ Firebase connection error"
        );

      }

    );

}


/* =====================================================
   CREATE METERED ROOM
===================================================== */

async function createMeteredRoom(roomId){

  const response =
    await fetch(
      CREATE_ROOM_API,
      {

        method:
          "POST",

        headers:{
          "Content-Type":
            "application/json",

          "Accept":
            "application/json"
        },

        body:
          JSON.stringify({

            roomName:
              roomId

          })

      }
    );


  const text =
    await response.text();


  let data;


  try{

    data =
      JSON.parse(text);

  }
  catch{

    data = {
      raw:text
    };

  }


  /*
     409 / already exists is okay.

     Your create-room.js is already designed
     to return success:true for this case.
  */

  if(
    response.ok
  ){

    return data;

  }


  const details =
    data?.details
      ? JSON.stringify(
          data.details
        )
      : "";


  throw new Error(
    (
      data?.error ||
      "Metered room creation failed"
    ) +
    (
      details
        ? "\n" + details
        : ""
    )
  );

}


/* =====================================================
   LOCAL TRACK
===================================================== */

function handleLocalTrack(item){

  if(
    !item ||
    !item.track
  ){

    return;

  }


  console.log(
    "LOCAL TRACK:",
    item.type,
    item.track
  );


  /*
     We only need video for the local
     video element.
  */

  if(
    item.type === "video"
  ){

    const stream =
      new MediaStream([
        item.track
      ]);


    localStream =
      stream;


    localVideo.srcObject =
      stream;


    localVideo.muted =
      true;


    localVideo.play()
      .catch(
        error =>
          console.log(
            "Local play:",
            error
          )
      );

  }

}


/* =====================================================
   REMOTE TRACK
===================================================== */

function handleRemoteTrack(item){

  if(
    !item ||
    !item.track
  ){

    return;

  }


  console.log(
    "REMOTE TRACK:",
    item.type,
    item
  );


  if(
    !remoteStream
  ){

    remoteStream =
      new MediaStream();

  }


  /*
     Do not add duplicate track.
  */

  const exists =
    remoteStream
      .getTracks()
      .some(
        track =>
          track.id ===
          item.track.id
      );


  if(!exists){

    remoteStream.addTrack(
      item.track
    );

  }


  remoteVideo.srcObject =
    remoteStream;


  remoteVideo.autoplay =
    true;

  remoteVideo.playsInline =
    true;


  remoteVideo.play()
    .catch(
      error =>
        console.log(
          "Remote play:",
          error
        )
    );


  /*
     Only video track means we have
     actual remote video.
  */

  if(
    item.type === "video"
  ){

    showConnecting(
      false
    );


    setStatus(
      "🟢 Connected"
    );


    setMessage(
      "🎥 Video chat connected"
    );


    enableCallButtons(
      true
    );


    stopConnectionTimer();

  }

}


/* =====================================================
   CONNECTION TIMEOUT
===================================================== */

function startConnectionTimer(){

  stopConnectionTimer();


  connectionTimer =
    setTimeout(
      ()=>{

        if(
          meeting &&
          !remoteStream
        ){

          console.log(
            "Connection timeout"
          );


          setMessage(
            "⚠️ Partner found but video did not connect. Retrying..."
          );


          reconnectCurrentRoom();

        }

      },
      25000
    );

}


function stopConnectionTimer(){

  if(connectionTimer){

    clearTimeout(
      connectionTimer
    );

    connectionTimer =
      null;

  }

}


/* =====================================================
   METERED CONNECTION
===================================================== */

async function connectMetered(roomId){

  if(connecting){

    return;

  }


  connecting =
    true;


  showConnecting(
    true
  );


  setStatus(
    "Connecting..."
  );


  setMessage(
    "📡 Joining video room..."
  );


  try{

    /*
       Make sure SDK is loaded.
    */

    if(
      !window.Metered ||
      !window.Metered.Meeting
    ){

      throw new Error(
        "Metered SDK did not load. Refresh the page."
      );

    }


    /*
       Clear previous media.
    */

    localStream =
      null;

    remoteStream =
      null;


    localVideo.srcObject =
      null;

    remoteVideo.srcObject =
      null;


    /*
       Create the room.

       Both phones may call this simultaneously.
       The backend handles an already-existing room.
    */

    await createMeteredRoom(
      roomId
    );


    /*
       Create a fresh Metered meeting.
    */

    meeting =
      new Metered.Meeting();


    /* =================================================
       LOCAL TRACK
    ================================================= */

    meeting.on(
      "localTrackStarted",
      handleLocalTrack
    );


    /* =================================================
       REMOTE TRACK
    ================================================= */

    meeting.on(
      "remoteTrackStarted",
      handleRemoteTrack
    );


    /* =================================================
       PARTICIPANT JOINED
    ================================================= */

    meeting.on(
      "participantJoined",
      info => {

        console.log(
          "👤 PARTICIPANT JOINED:",
          info
        );


        setStatus(
          "🟢 Connected"
        );


        setMessage(
          "👤 Partner joined the room"
        );


        /*
           Do not stop the connection timer here.
           We wait for actual remote video.
        */

      }
    );


    /* =================================================
       PARTICIPANT LEFT
    ================================================= */

    meeting.on(
      "participantLeft",
      info => {

        console.log(
          "👋 PARTICIPANT LEFT:",
          info
        );


        remoteStream =
          null;

        remoteVideo.srcObject =
          null;


        showConnecting(
          false
        );


        setStatus(
          "Online"
        );


        setMessage(
          "👋 Partner left. Press Next."
        );


        enableCallButtons(
          true
        );

      }
    );


    /*
       Some Metered versions can emit track stopped
       events. Keep the UI safe if available.
    */

    try{

      meeting.on(
        "remoteTrackStopped",
        item => {

          console.log(
            "Remote track stopped:",
            item
          );

        }
      );

    }
    catch(error){

      console.log(
        "remoteTrackStopped listener unavailable"
      );

    }


    /* =================================================
       JOIN ROOM
    ================================================= */

    const roomURL =
      "https://" +
      METERED_DOMAIN +
      "/" +
      encodeURIComponent(
        roomId
      );


    console.log(
      "Joining Metered room:",
      roomURL
    );


    const meetingInfo =
      await meeting.join({

        roomURL:
          roomURL,

        name:
          "Ravi-" +
          userId.substring(
            0,
            8
          ),

        receiveVideoStreamType:
          "only_individual",

        receiveAudioStreamType:
          "only_individual"

      });


    console.log(
      "✅ METERED JOINED:",
      meetingInfo
    );


    /*
       Start camera.
    */

    try{

      await meeting.startVideo();

    }
    catch(error){

      console.error(
        "Camera start failed:",
        error
      );

      throw new Error(
        "Camera could not start. Please allow camera permission."
      );

    }


    /*
       Start microphone.
    */

    try{

      await meeting.startAudio();

    }
    catch(error){

      console.error(
        "Microphone start failed:",
        error
      );

      /*
         Audio failure should not necessarily
         kill the video call.
      */

      setMessage(
        "🎥 Video connected. Microphone unavailable."
      );

    }


    enableCallButtons(
      true
    );


    setStatus(
      "🟢 Connected"
    );


    setMessage(
      "🎥 Waiting for partner video..."
    );


    startConnectionTimer();


    /*
       Gift listener.
    */

    listenForGifts(
      roomId
    );


  }
  catch(error){

    console.error(
      "❌ METERED CONNECTION ERROR:",
      error
    );


    stopConnectionTimer();


    /*
       Clean failed meeting.
    */

    try{

      if(meeting){

        if(
          typeof meeting.leaveMeeting ===
          "function"
        ){

          await meeting.leaveMeeting();

        }
        else if(
          typeof meeting.leave ===
          "function"
        ){

          await meeting.leave();

        }

      }

    }
    catch(leaveError){

      console.log(
        "Failed meeting leave:",
        leaveError
      );

    }


    meeting =
      null;


    localStream =
      null;

    remoteStream =
      null;


    localVideo.srcObject =
      null;

    remoteVideo.srcObject =
      null;


    showConnecting(
      false
    );


    enableCallButtons(
      false
    );


    setStatus(
      "Offline"
    );


    setMessage(
      "❌ Video connection failed"
    );


    /*
       Put user back into waiting state.
    */

    try{

      await enterQueue();

    }
    catch(queueError){

      console.log(
        "Requeue error:",
        queueError
      );

    }


    alert(
      "Video connection failed.\n\n" +
      error.message +
      "\n\nPlease make sure Camera and Microphone permissions are allowed."
    );

  }
  finally{

    connecting =
      false;

  }

}


/* =====================================================
   RECONNECT CURRENT ROOM
===================================================== */

async function reconnectCurrentRoom(){

  if(
    !currentRoom ||
    connecting
  ){

    return;

  }


  await leaveMeeting();


  await new Promise(
    resolve =>
      setTimeout(
        resolve,
        500
      )
  );


  await connectMetered(
    currentRoom
  );

}


/* =====================================================
   START
===================================================== */

async function start(){

  if(busy){

    return;

  }


  busy =
    true;


  startBtn.disabled =
    true;


  try{

    /*
       First request camera/mic permission.
    */

    await checkMediaPermission();


    permissionBox.style.display =
      "none";


    setStatus(
      "Online"
    );


    setMessage(
      "🎥 Starting..."
    );


    /*
       Clean any old queue entry.
    */

    await removeFromQueue();


    /*
       Enter Firebase waiting queue.
    */

    await enterQueue();


    /*
       Listen before searching.

       This is important because the other phone
       can match us immediately.
    */

    listenForMatch();


    /*
       Try to find someone already waiting.
    */

    const found =
      await findPartner();


    if(found){

      setStatus(
        "Connecting..."
      );


      setMessage(
        "🎉 Partner found! Connecting..."
      );

    }
    else{

      setStatus(
        "Searching..."
      );


      setMessage(
        "🔎 Waiting for a random partner..."
      );

    }

  }
  catch(error){

    console.error(
      "START ERROR:",
      error
    );


    setStatus(
      "Offline"
    );


    setMessage(
      "❌ Start failed"
    );


    startBtn.disabled =
      false;

  }


  busy =
    false;

}


/* =====================================================
   NEXT
===================================================== */

async function next(){

  if(busy){

    return;

  }


  busy =
    true;


  nextBtn.disabled =
    true;


  try{

    setMessage(
      "⏭ Finding another partner..."
    );


    setStatus(
      "Searching..."
    );


    showConnecting(
      false
    );


    await leaveMeeting();


    currentRoom =
      null;

    currentPartner =
      null;


    await removeFromQueue();


    await enterQueue();


    listenForMatch();


    const found =
      await findPartner();


    if(found){

      setStatus(
        "Connecting..."
      );


      setMessage(
        "🎉 Partner found! Connecting..."
      );

    }
    else{

      setStatus(
        "Searching..."
      );


      setMessage(
        "🔎 Waiting for another partner..."
      );

    }

  }
  catch(error){

    console.error(
      "NEXT ERROR:",
      error
    );


    setStatus(
      "Offline"
    );


    setMessage(
      "❌ Next failed"
    );

  }


  busy =
    false;

}


/* =====================================================
   LEAVE METERED MEETING
===================================================== */

async function leaveMeeting(){

  stopConnectionTimer();


  if(giftListener){

    try{

      giftListener();

    }
    catch(error){

      console.log(
        "Gift listener cleanup:",
        error
      );

    }

    giftListener =
      null;

  }


  if(meeting){

    try{

      if(
        typeof meeting.leaveMeeting ===
        "function"
      ){

        await meeting.leaveMeeting();

      }
      else if(
        typeof meeting.leave ===
        "function"
      ){

        await meeting.leave();

      }

    }
    catch(error){

      console.log(
        "Leave meeting error:",
        error
      );

    }

  }


  meeting =
    null;


  localStream =
    null;

  remoteStream =
    null;


  localVideo.srcObject =
    null;

  remoteVideo.srcObject =
    null;


  muted =
    false;

  cameraOff =
    false;


  muteBtn.innerText =
    "🎤";

  cameraBtn.innerText =
    "📷";


  showConnecting(
    false
  );

}


/* =====================================================
   END CALL
===================================================== */

async function endCall(){

  if(busy){

    return;

  }


  await leaveMeeting();


  if(queueListener){

    queueListener();

    queueListener =
      null;

  }


  await removeFromQueue();


  currentRoom =
    null;

  currentPartner =
    null;


  connecting =
    false;


  enableCallButtons(
    false
  );


  startBtn.disabled =
    false;


  setStatus(
    "Offline"
  );


  setMessage(
    "Press Start to begin"
  );

}


/* =====================================================
   MUTE
===================================================== */

muteBtn.onclick =
async function(){

  if(!meeting){

    return;

  }


  try{

    if(!muted){

      await meeting.stopAudio();


      muted =
        true;


      muteBtn.innerText =
        "🔇";

    }
    else{

      await meeting.startAudio();


      muted =
        false;


      muteBtn.innerText =
        "🎤";

    }

  }
  catch(error){

    console.error(
      "Mute error:",
      error
    );

  }

};


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.onclick =
async function(){

  if(!meeting){

    return;

  }


  try{

    if(!cameraOff){

      await meeting.stopVideo();


      cameraOff =
        true;


      cameraBtn.innerText =
        "🚫";

    }
    else{

      await meeting.startVideo();


      cameraOff =
        false;


      cameraBtn.innerText =
        "📷";

    }

  }
  catch(error){

    console.error(
      "Camera error:",
      error
    );

  }

};


/* =====================================================
   GIFT MENU
===================================================== */

giftBtn.onclick =
function(){

  if(
    giftBox.style.display ===
    "block"
  ){

    giftBox.style.display =
      "none";

  }
  else{

    giftBox.style.display =
      "block";

  }

};


/* =====================================================
   SEND GIFT
===================================================== */

document
  .querySelectorAll(".gift")
  .forEach(
    button => {

      button.onclick =
      async function(){

        const gift =
          button.dataset.gift;


        giftBox.style.display =
          "none";


        showGift(
          gift
        );


        if(
          currentRoom &&
          currentPartner
        ){

          try{

            await setDoc(

              doc(
                collection(
                  db,
                  "rooms",
                  currentRoom,
                  "gifts"
                )
              ),

              {

                from:
                  userId,

                to:
                  currentPartner,

                gift:
                  gift,

                createdAt:
                  serverTimestamp()

              }

            );

          }
          catch(error){

            console.error(
              "Gift send error:",
              error
            );

          }

        }

      };

    }
  );


/* =====================================================
   SHOW GIFT
===================================================== */

function showGift(gift){

  giftAnimation.innerText =
    gift;


  giftAnimation.style.display =
    "block";


  setTimeout(
    ()=>{

      giftAnimation.style.display =
        "none";

    },
    1000
  );

}


/* =====================================================
   GIFT LISTENER
===================================================== */

function listenForGifts(roomId){

  if(giftListener){

    giftListener();

    giftListener =
      null;

  }


  giftListener =
    onSnapshot(

      collection(
        db,
        "rooms",
        roomId,
        "gifts"
      ),

      snapshot => {

        snapshot
          .docChanges()
          .forEach(
            change => {

              if(
                change.type !==
                "added"
              ){

                return;

              }


              const data =
                change.doc.data();


              if(
                data.to ===
                userId
              ){

                showGift(
                  data.gift
                );

              }

            }
          );

      },

      error => {

        console.log(
          "Gift listener error:",
          error
        );

      }

    );

}


/* =====================================================
   PERMISSION BUTTON
===================================================== */

permissionBtn.onclick =
async function(){

  try{

    await checkMediaPermission();


    permissionBox.style.display =
      "none";


    setMessage(
      "✅ Camera and microphone allowed. Press Start."
    );

  }
  catch(error){

    alert(
      "Please allow Camera and Microphone permission in your browser settings."
    );

  }

};


/* =====================================================
   BUTTON EVENTS
===================================================== */

startBtn.onclick =
  start;

nextBtn.onclick =
  next;

endBtn.onclick =
  endCall;


/* =====================================================
   PAGE VISIBILITY
===================================================== */

document.addEventListener(
  "visibilitychange",
  ()=>{

    /*
       We intentionally do not disconnect
       when the browser becomes hidden.

       Mobile browsers can temporarily hide
       the page while keeping the call alive.
    */

    if(
      !document.hidden &&
      remoteVideo.srcObject
    ){

      remoteVideo.play()
        .catch(
          ()=>{}
        );

      localVideo.play()
        .catch(
          ()=>{}
        );

    }

  }
);


/* =====================================================
   INITIAL STATE
===================================================== */

setStatus(
  "Offline"
);

setMessage(
  "Press Start to begin"
);

enableCallButtons(
  false
);

console.log(
  "================================="
);

console.log(
  "✅ Ravi Chat initialized"
);

console.log(
  "User ID:",
  userId
);

console.log(
  "Metered domain:",
  METERED_DOMAIN
);

console.log(
  "================================="
);

</script>
