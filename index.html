<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ravi Video Call</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 10px 30px;
      font-family: Arial, sans-serif;
      background: #101828;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    .status {
      margin: 10px 0 15px;
      color: #4ade80;
      font-weight: bold;
    }

    .videos {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 10px;
    }

    video {
      width: 100%;
      max-width: 600px;
      height: 280px;
      background: #000;
      border-radius: 18px;
      object-fit: cover;
      margin: auto;
      border: 2px solid #26334d;
    }

    .controls {
      padding: 10px;
    }

    input {
      width: 90%;
      max-width: 400px;
      padding: 16px;
      border-radius: 12px;
      border: none;
      margin: 10px auto;
      font-size: 17px;
      display: block;
    }

    button {
      padding: 15px 22px;
      margin: 8px 4px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #startBtn {
      background: #22c55e;
      color: white;
    }

    #joinBtn {
      background: #3b82f6;
      color: white;
    }

    #hangupBtn {
      background: #ef4444;
      color: white;
    }

    #roomCode {
      color: #facc15;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 5px;
      word-break: break-all;
    }

    .info {
      font-size: 14px;
      color: #aab4c5;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <h1>📹 Ravi Video Call</h1>

  <div id="status" class="status">
    🟢 Ready
  </div>

  <div class="videos">

    <video
      id="localVideo"
      autoplay
      muted
      playsinline>
    </video>

    <video
      id="remoteVideo"
      autoplay
      playsinline>
    </video>

  </div>

  <div class="controls">

    <button id="startBtn">
      📞 Create Call
    </button>

    <div id="roomCode"></div>

    <input
      id="roomInput"
      type="text"
      placeholder="Enter Room Code"
      autocomplete="off"
    >

    <button id="joinBtn">
      📲 Join Call
    </button>

    <button id="hangupBtn">
      ❌ Hang Up
    </button>

    <div class="info">
      माथिको Room Code अर्को फोनमा राख्नुहोस्।
    </div>

  </div>


<script type="module">

  /* ================================
     FIREBASE
  ================================= */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    updateDoc,
    collection,
    addDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

    authDomain:
      "ravi-video-call-fa15d.firebaseapp.com",

    projectId:
      "ravi-video-call-fa15d",

    storageBucket:
      "ravi-video-call-fa15d.firebasestorage.app",

    messagingSenderId:
      "1079442344769",

    appId:
      "1:1079442344769:web:d7812efaf277c3f6d4efc0",

    measurementId:
      "G-69RY93XC91"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* ================================
     HTML ELEMENTS
  ================================= */

  const localVideo =
    document.getElementById("localVideo");

  const remoteVideo =
    document.getElementById("remoteVideo");

  const startBtn =
    document.getElementById("startBtn");

  const joinBtn =
    document.getElementById("joinBtn");

  const hangupBtn =
    document.getElementById("hangupBtn");

  const roomInput =
    document.getElementById("roomInput");

  const roomCode =
    document.getElementById("roomCode");

  const status =
    document.getElementById("status");


  /* ================================
     VARIABLES
  ================================= */

  let localStream = null;

  let remoteStream = null;

  let peerConnection = null;

  let currentRoom = null;

  let unsubscribeRoom = null;

  let unsubscribeRemoteCandidates = null;


  /* ================================
     STUN + TURN
  ================================= */

  /*
    TURN is important when two phones
    cannot connect directly.

    Open Relay provides TURN service.
  */

  const servers = {

    iceServers: [

      /* Google STUN */

      {
        urls: "stun:stun.l.google.com:19302"
      },

      /* Metered/Open Relay STUN */

      {
        urls: "stun:stun.relay.metered.ca:80"
      },

      /* TURN UDP */

      {
        urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject",
        credential: "openrelayproject"
      },

      /* TURN TCP */

      {
        urls: "turn:openrelay.metered.ca:80?transport=tcp",
        username: "openrelayproject",
        credential: "openrelayproject"
      },

      /* TURN 443 */

      {
        urls: "turn:openrelay.metered.ca:443",
        username: "openrelayproject",
        credential: "openrelayproject"
      },

      /* TURN TLS */

      {
        urls: "turns:openrelay.metered.ca:443?transport=tcp",
        username: "openrelayproject",
        credential: "openrelayproject"
      }

    ],

    iceCandidatePoolSize: 10
  };


  /* ================================
     STATUS
  ================================= */

  function setStatus(text, color = "#4ade80") {

    status.innerText = text;

    status.style.color = color;
  }


  /* ================================
     START CAMERA
  ================================= */

  async function startCamera() {

    if (localStream) {
      return;
    }

    setStatus(
      "📷 Camera/Microphone खोल्दै...",
      "#facc15"
    );

    localStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },

        audio: true

      });


    localVideo.srcObject = localStream;


    try {
      await localVideo.play();
    } catch (e) {
      console.log("Local video play:", e);
    }


    remoteStream = new MediaStream();

    remoteVideo.srcObject =
      remoteStream;


    peerConnection =
      new RTCPeerConnection(servers);


    /* Add local tracks */

    localStream.getTracks().forEach(track => {

      peerConnection.addTrack(
        track,
        localStream
      );

    });


    /* Receive remote tracks */

    peerConnection.ontrack = event => {

      console.log(
        "REMOTE TRACK RECEIVED",
        event.track.kind
      );


      event.streams[0]
        .getTracks()
        .forEach(track => {

          if (
            !remoteStream
              .getTracks()
              .some(t => t.id === track.id)
          ) {

            remoteStream.addTrack(track);

          }

        });


      remoteVideo.srcObject =
        remoteStream;


      remoteVideo.play()
        .catch(error => {

          console.log(
            "Remote video play error:",
            error
          );

        });


      setStatus(
        "🟢 Video Connected",
        "#4ade80"
      );

    };


    /* ICE state */

    peerConnection.oniceconnectionstatechange =
      () => {

        console.log(
          "ICE:",
          peerConnection.iceConnectionState
        );


        const state =
          peerConnection.iceConnectionState;


        if (state === "checking") {

          setStatus(
            "🔄 Connecting...",
            "#facc15"
          );

        }

        if (state === "connected" ||
            state === "completed") {

          setStatus(
            "🟢 Video Connected",
            "#4ade80"
          );

        }

        if (state === "failed") {

          setStatus(
            "🔴 Connection Failed",
            "#ef4444"
          );

        }

        if (state === "disconnected") {

          setStatus(
            "🟠 Disconnected",
            "#f97316"
          );

        }

      };


    /* Peer connection state */

    peerConnection.onconnectionstatechange =
      () => {

        console.log(
          "Connection:",
          peerConnection.connectionState
        );

      };

  }


  /* ================================
     CREATE CALL
  ================================= */

  startBtn.onclick = async () => {

    try {

      await startCamera();


      setStatus(
        "📞 Creating call...",
        "#facc15"
      );


      /* Create Firebase room */

      const roomRef =
        doc(collection(db, "rooms"));


      currentRoom =
        roomRef.id;


      const callerCandidates =
        collection(
          roomRef,
          "callerCandidates"
        );


      const calleeCandidates =
        collection(
          roomRef,
          "calleeCandidates"
        );


      /* Caller ICE */

      peerConnection.onicecandidate =
        async event => {

          if (event.candidate) {

            try {

              await addDoc(
                callerCandidates,
                event.candidate.toJSON()
              );

            } catch (error) {

              console.error(
                "Caller ICE error:",
                error
              );

            }

          }

        };


      /* Create offer */

      const offer =
        await peerConnection.createOffer({

          offerToReceiveAudio: true,
          offerToReceiveVideo: true

        });


      await peerConnection.setLocalDescription(
        offer
      );


      /* Save offer */

      await setDoc(
        roomRef,
        {

          offer: {

            type: offer.type,

            sdp: offer.sdp

          }

        }
      );


      /* Show room */

      roomCode.innerText =
        "Room Code: " + currentRoom;


      roomInput.value =
        currentRoom;


      setStatus(
        "🟡 Waiting for other phone...",
        "#facc15"
      );


      /* Listen for answer */

      unsubscribeRoom =
        onSnapshot(
          roomRef,
          async snapshot => {

            const data =
              snapshot.data();


            if (
              data &&
              data.answer &&
              !peerConnection
                .currentRemoteDescription
            ) {

              console.log(
                "ANSWER RECEIVED"
              );


              const answer =
                new RTCSessionDescription(
                  data.answer
                );


              await peerConnection
                .setRemoteDescription(
                  answer
                );


              setStatus(
                "🔄 Connecting video...",
                "#facc15"
              );

            }

          }
        );


      /* Receive callee ICE */

      unsubscribeRemoteCandidates =
        onSnapshot(
          calleeCandidates,
          snapshot => {

            snapshot.docChanges()
              .forEach(async change => {

                if (
                  change.type === "added"
                ) {

                  try {

                    const candidate =
                      change.doc.data();


                    await peerConnection
                      .addIceCandidate(
                        new RTCIceCandidate(
                          candidate
                        )
                      );


                    console.log(
                      "Callee ICE added"
                    );

                  } catch (error) {

                    console.error(
                      "Add callee ICE:",
                      error
                    );

                  }

                }

              });

          }
        );


      alert(
        "Call created!\n\nRoom Code:\n" +
        currentRoom +
        "\n\nयो code अर्को फोनमा राख्नुहोस्।"
      );


    } catch (error) {

      console.error(error);


      setStatus(
        "🔴 Camera/Microphone Error",
        "#ef4444"
      );


      alert(
        "Camera/Microphone error:\n" +
        error.message
      );

    }

  };


  /* ================================
     JOIN CALL
  ================================= */

  joinBtn.onclick = async () => {

    try {

      const code =
        roomInput.value.trim();


      if (!code) {

        alert(
          "Room Code राख्नुहोस्।"
        );

        return;

      }


      await startCamera();


      setStatus(
        "🔍 Room खोज्दै...",
        "#facc15"
      );


      currentRoom =
        code;


      const roomRef =
        doc(db, "rooms", code);


      const roomSnapshot =
        await getDoc(roomRef);


      if (!roomSnapshot.exists()) {

        setStatus(
          "🔴 Room भेटिएन",
          "#ef4444"
        );


        alert(
          "Room भेटिएन।\nRoom Code सही छ कि जाँच गर्नुहोस्।"
        );


        return;

      }


      const roomData =
        roomSnapshot.data();


      if (!roomData.offer) {

        alert(
          "यो room मा Call offer छैन।"
        );

        return;

      }


      const callerCandidates =
        collection(
          roomRef,
          "callerCandidates"
        );


      const calleeCandidates =
        collection(
          roomRef,
          "calleeCandidates"
        );


      /* Callee ICE */

      peerConnection.onicecandidate =
        async event => {

          if (event.candidate) {

            try {

              await addDoc(
                calleeCandidates,
                event.candidate.toJSON()
              );

            } catch (error) {

              console.error(
                "Callee ICE error:",
                error
              );

            }

          }

        };


      /* Set caller offer */

      await peerConnection
        .setRemoteDescription(
          new RTCSessionDescription(
            roomData.offer
          )
        );


      /* Create answer */

      const answer =
        await peerConnection.createAnswer({

          offerToReceiveAudio: true,
          offerToReceiveVideo: true

        });


      await peerConnection
        .setLocalDescription(
          answer
        );


      /* Save answer */

      await updateDoc(
        roomRef,
        {

          answer: {

            type: answer.type,

            sdp: answer.sdp

          }

        }
      );


      setStatus(
        "🔄 Connecting video...",
        "#facc15"
      );


      /* Receive caller ICE */

      unsubscribeRemoteCandidates =
        onSnapshot(
          callerCandidates,
          snapshot => {

            snapshot.docChanges()
              .forEach(async change => {

                if (
                  change.type === "added"
                ) {

                  try {

                    const candidate =
                      change.doc.data();


                    await peerConnection
                      .addIceCandidate(
                        new RTCIceCandidate(
                          candidate
                        )
                      );


                    console.log(
                      "Caller ICE added"
                    );

                  } catch (error) {

                    console.error(
                      "Add caller ICE:",
                      error
                    );

                  }

                }

              });

          }
        );


      alert(
        "Joined the call!"
      );


    } catch (error) {

      console.error(error);


      setStatus(
        "🔴 Join Error",
        "#ef4444"
      );


      alert(
        "Join error:\n" +
        error.message
      );

    }

  };


  /* ================================
     HANG UP
  ================================= */

  hangupBtn.onclick = () => {


    if (unsubscribeRoom) {

      unsubscribeRoom();

      unsubscribeRoom = null;

    }


    if (unsubscribeRemoteCandidates) {

      unsubscribeRemoteCandidates();

      unsubscribeRemoteCandidates = null;

    }


    if (localStream) {

      localStream
        .getTracks()
        .forEach(track => {

          track.stop();

        });

      localStream = null;

    }


    if (peerConnection) {

      peerConnection.close();

      peerConnection = null;

    }


    localVideo.srcObject = null;

    remoteVideo.srcObject = null;

    remoteStream = null;

    currentRoom = null;


    roomCode.innerText = "";

    roomInput.value = "";


    setStatus(
      "🟢 Ready",
      "#4ade80"
    );

  };


  /* ================================
     FIREBASE READY
  ================================= */

  console.log(
    "Firebase connected!"
  );

</script>

</body>
</html>
