<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ravi Chat</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  background:#050505;
}

video{
  position:absolute;
  background:#000;
  object-fit:cover;
}

#remoteVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

#localVideo{
  position:absolute;
  top:70px;
  right:12px;
  width:110px;
  height:155px;
  border:2px solid #fff;
  border-radius:15px;
  z-index:5;
  background:#000;
  object-fit:cover;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:17px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#000e,transparent);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

#status{
  padding:8px 13px;
  border-radius:20px;
  background:#475569;
  font-size:12px;
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:10;
  text-align:center;
  padding:18px 10px 28px;
  background:linear-gradient(transparent,#000f);
}

#message{
  margin-bottom:14px;
  font-size:14px;
  min-height:20px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  padding:13px 18px;
  border-radius:25px;
  cursor:pointer;
}

button:active{
  transform:scale(.96);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

#startBtn{
  background:#16a34a;
}

#nextBtn{
  background:#2563eb;
}

#endBtn{
  background:#dc2626;
}

#giftBtn{
  background:#db2777;
}

.small{
  width:50px;
  height:50px;
  padding:0;
  border-radius:50%;
  background:#333;
}

/* GIFT BOX */

#giftBox{
  display:none;
  position:absolute;
  bottom:105px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  width:280px;
  padding:15px;
  border-radius:20px;
  background:#202020;
  box-shadow:0 10px 30px #000;
}

#giftBox h3{
  margin:5px 0 15px;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gift{
  background:#333;
  border-radius:15px;
  padding:12px 5px;
  cursor:pointer;
  font-size:25px;
  text-align:center;
}

.gift:active{
  transform:scale(.9);
}

/* GIFT ANIMATION */

#giftAnimation{
  display:none;
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:50;
  font-size:90px;
  animation:pop .8s ease;
  pointer-events:none;
}

@keyframes pop{
  0%{
    transform:translate(-50%,-50%) scale(.2);
  }

  70%{
    transform:translate(-50%,-50%) scale(1.3);
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
  }
}

/* MOBILE */

@media(max-width:420px){

  #localVideo{
    width:105px;
    height:150px;
  }

  button{
    padding:12px 16px;
    font-size:14px;
  }

  .small{
    width:48px;
    height:48px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- REMOTE VIDEO -->

  <video
    id="remoteVideo"
    autoplay
    playsinline>
  </video>


  <!-- LOCAL VIDEO -->

  <video
    id="localVideo"
    autoplay
    muted
    playsinline>
  </video>


  <!-- GIFT ANIMATION -->

  <div id="giftAnimation"></div>


  <!-- TOP -->

  <div class="top">

    <div class="logo">
      📹 Ravi Chat
    </div>

    <div id="status">
      Offline
    </div>

  </div>


  <!-- GIFT BOX -->

  <div id="giftBox">

    <h3>
      🎁 Send Gift
    </h3>

    <div class="gifts">

      <div
        class="gift"
        data-gift="❤️">
        ❤️
      </div>

      <div
        class="gift"
        data-gift="🌹">
        🌹
      </div>

      <div
        class="gift"
        data-gift="⭐">
        ⭐
      </div>

      <div
        class="gift"
        data-gift="🎉">
        🎉
      </div>

      <div
        class="gift"
        data-gift="💎">
        💎
      </div>

      <div
        class="gift"
        data-gift="🔥">
        🔥
      </div>

      <div
        class="gift"
        data-gift="🎂">
        🎂
      </div>

      <div
        class="gift"
        data-gift="👑">
        👑
      </div>

    </div>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <div id="message">
      Press Start to begin
    </div>

    <div class="buttons">

      <button id="startBtn">
        ▶ Start
      </button>

      <button
        id="nextBtn"
        disabled>
        ⏭ Next
      </button>

      <button
        id="muteBtn"
        class="small"
        disabled>
        🎤
      </button>

      <button
        id="cameraBtn"
        class="small"
        disabled>
        📷
      </button>

      <button
        id="giftBtn"
        disabled>
        🎁 Gift
      </button>

      <button
        id="endBtn"
        disabled>
        ☎ End
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     METERED SDK
===================================================== -->

<script src="https://cdn.metered.ca/sdk/video/1.4.6/sdk.min.js"></script>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  deleteDoc,
  collection,
  query,
  where,
  limit,
  getDocs,
  onSnapshot,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

  authDomain:
    "ravi-video-call-fa15d.firebaseapp.com",

  projectId:
    "ravi-video-call-fa15d",

  storageBucket:
    "ravi-video-call-fa15d.firebasestorage.app",

  messagingSenderId:
    "1079442344769",

  appId:
    "1:1079442344769:web:d7812efaf277c3f6d4efc0",

  measurementId:
    "G-69RY93XC91"
};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =====================================================
   BACKEND
===================================================== */

/*
  IMPORTANT:

  Metered Secret Key is NOT stored here.

  Vercel backend:
  
  /api/create-room
*/

const CREATE_ROOM_API =
  "/api/create-room";


/* =====================================================
   METERED DOMAIN
===================================================== */

/*
  This is your Metered application domain.

  Your existing code uses:

  ravi-video-call.metered.live

  Keep this exactly as your Metered app name.
*/

const METERED_DOMAIN =
  "ravi-video-call.metered.live";


/* =====================================================
   ELEMENTS
===================================================== */

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const startBtn =
  document.getElementById("startBtn");

const nextBtn =
  document.getElementById("nextBtn");

const endBtn =
  document.getElementById("endBtn");

const muteBtn =
  document.getElementById("muteBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const giftBtn =
  document.getElementById("giftBtn");

const giftBox =
  document.getElementById("giftBox");

const giftAnimation =
  document.getElementById("giftAnimation");

const statusEl =
  document.getElementById("status");

const messageEl =
  document.getElementById("message");


/* =====================================================
   STATE
===================================================== */

const userId =
  crypto.randomUUID();

let meeting = null;

let queueListener = null;

let giftListener = null;

let currentRoom = null;

let currentPartner = null;

let muted = false;

let cameraOff = false;

let busy = false;


/* =====================================================
   STATUS
===================================================== */

function status(text){

  statusEl.innerText =
    text;


  if(
    text.includes("Connected") ||
    text.includes("Online")
  ){

    statusEl.style.background =
      "#16a34a";

  }else if(
    text.includes("Searching") ||
    text.includes("Connecting") ||
    text.includes("Joining")
  ){

    statusEl.style.background =
      "#f59e0b";

  }else{

    statusEl.style.background =
      "#475569";
  }
}


/* =====================================================
   MESSAGE
===================================================== */

function message(text){

  messageEl.innerText =
    text;
}


/* =====================================================
   BUTTON STATE
===================================================== */

function callButtons(enabled){

  nextBtn.disabled =
    !enabled;

  endBtn.disabled =
    !enabled;

  muteBtn.disabled =
    !enabled;

  cameraBtn.disabled =
    !enabled;

  giftBtn.disabled =
    !enabled;
}


/* =====================================================
   QUEUE
===================================================== */

async function enterQueue(){

  await setDoc(

    doc(
      db,
      "matchQueue",
      userId
    ),

    {
      userId:userId,

      state:"waiting",

      partner:null,

      roomId:null,

      createdAt:
        serverTimestamp()
    }

  );
}


/* =====================================================
   FIND PARTNER
===================================================== */

async function findPartner(){

  const q =
    query(

      collection(
        db,
        "matchQueue"
      ),

      where(
        "state",
        "==",
        "waiting"
      ),

      limit(10)

    );


  const snapshot =
    await getDocs(q);


  for(
    const candidate
    of snapshot.docs
  ){

    const partnerId =
      candidate.data().userId;


    if(
      partnerId === userId
    ){
      continue;
    }


    const myRef =
      doc(
        db,
        "matchQueue",
        userId
      );


    const partnerRef =
      doc(
        db,
        "matchQueue",
        partnerId
      );


    const roomId =
      "ravi-" +
      Math.random()
        .toString(36)
        .substring(2,10);


    try{

      const success =
        await runTransaction(

          db,

          async(transaction)=>{

            const me =
              await transaction.get(
                myRef
              );


            const partner =
              await transaction.get(
                partnerRef
              );


            if(
              !me.exists() ||
              !partner.exists()
            ){

              return false;
            }


            if(
              me.data().state !==
              "waiting" ||

              partner.data().state !==
              "waiting"
            ){

              return false;
            }


            transaction.update(

              myRef,

              {
                state:"matched",

                partner:partnerId,

                roomId:roomId
              }

            );


            transaction.update(

              partnerRef,

              {
                state:"matched",

                partner:userId,

                roomId:roomId
              }

            );


            return true;

          }

        );


      if(success){

        currentRoom =
          roomId;

        currentPartner =
          partnerId;


        return true;
      }

    }catch(error){

      console.error(
        "Match transaction error:",
        error
      );
    }

  }


  return false;
}


/* =====================================================
   MATCH LISTENER
===================================================== */

function listenForMatch(){

  if(queueListener){

    queueListener();

    queueListener =
      null;
  }


  queueListener =
    onSnapshot(

      doc(
        db,
        "matchQueue",
        userId
      ),

      async(snapshot)=>{

        if(
          !snapshot.exists()
        ){

          return;
        }


        const data =
          snapshot.data();


        if(
          data.state ===
          "matched" &&

          data.roomId
        ){

          if(
            meeting &&
            currentRoom ===
            data.roomId
          ){

            return;
          }


          currentRoom =
            data.roomId;


          currentPartner =
            data.partner;


          message(
            "🎉 Partner found!"
          );


          status(
            "Connecting..."
          );


          await connectMetered(
            data.roomId
          );

        }

      },

      (error)=>{

        console.error(
          "Queue listener error:",
          error
        );

        message(
          "❌ Matching error"
        );

      }

    );
}


/* =====================================================
   CREATE METERED ROOM
===================================================== */

async function createMeteredRoom(roomId){

  message(
    "🏠 Creating video room..."
  );


  const response =
    await fetch(

      CREATE_ROOM_API,

      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            roomName:roomId
          })
      }

    );


  console.log(
    "create-room status:",
    response.status
  );


  if(
    !response.ok
  ){

    let errorText =
      "Backend room creation failed";


    try{

      const errorData =
        await response.json();


      if(
        errorData.error
      ){

        errorText =
          errorData.error;

      }

    }catch(error){

      console.log(
        "Could not read backend error",
        error
      );

    }


    throw new Error(
      errorText
    );
  }


  const result =
    await response.json();


  console.log(
    "Metered room response:",
    result
  );


  return result;
}


/* =====================================================
   METERED CONNECT
===================================================== */

async function connectMetered(roomId){

  try{

    /* -----------------------------------------------
       STEP 1
    ----------------------------------------------- */

    status(
      "Connecting..."
    );

    message(
      "📡 Preparing video connection..."
    );


    /* -----------------------------------------------
       CHECK SDK
    ----------------------------------------------- */

    if(
      !window.Metered
    ){

      throw new Error(
        "Metered SDK did not load"
      );
    }


    console.log(
      "Metered SDK loaded:",
      window.Metered
    );


    /* -----------------------------------------------
       STEP 2
       CREATE ROOM
    ----------------------------------------------- */

    const roomResult =
      await createMeteredRoom(
        roomId
      );


    console.log(
      "Room created:",
      roomResult
    );


    message(
      "🏠 Video room ready..."
    );


    /* -----------------------------------------------
       STEP 3
       CREATE MEETING
    ----------------------------------------------- */

    meeting =
      new Metered.Meeting();


    if(
      !meeting
    ){

      throw new Error(
        "Could not create Metered Meeting"
      );
    }


    console.log(
      "Metered Meeting object created"
    );


    /* -----------------------------------------------
       LOCAL TRACK
    ----------------------------------------------- */

    meeting.on(

      "localTrackStarted",

      async(item)=>{

        console.log(
          "LOCAL TRACK:",
          item
        );


        if(
          item.type ===
          "video"
        ){

          const stream =
            new MediaStream();


          stream.addTrack(
            item.track
          );


          localVideo.srcObject =
            stream;


          try{

            await localVideo.play();

          }catch(error){

            console.log(
              "Local video play error:",
              error
            );

          }

        }

      }

    );


    /* -----------------------------------------------
       REMOTE TRACK
    ----------------------------------------------- */

    meeting.on(

      "remoteTrackStarted",

      async(item)=>{

        console.log(
          "REMOTE TRACK:",
          item
        );


        if(
          item.type ===
          "video"
        ){

          const stream =
            new MediaStream();


          stream.addTrack(
            item.track
          );


          remoteVideo.srcObject =
            stream;


          try{

            await remoteVideo.play();

          }catch(error){

            console.log(
              "Remote video play error:",
              error
            );

          }


          status(
            "🟢 Connected"
          );


          message(
            "🎥 Video chat connected"
          );


          callButtons(true);

        }

      }

    );


    /* -----------------------------------------------
       PARTICIPANT JOINED
    ----------------------------------------------- */

    meeting.on(

      "participantJoined",

      info=>{

        console.log(
          "👤 Participant joined:",
          info
        );


        status(
          "🟢 Connected"
        );


        message(
          "🎥 Partner connected"
        );


        callButtons(true);

      }

    );


    /* -----------------------------------------------
       PARTICIPANT LEFT
    ----------------------------------------------- */

    meeting.on(

      "participantLeft",

      info=>{

        console.log(
          "👋 Participant left:",
          info
        );


        remoteVideo.srcObject =
          null;


        status(
          "Online"
        );


        message(
          "👋 Partner left. Press Next."
        );

      }

    );


    /* -----------------------------------------------
       STEP 4
       JOIN METERED
    ----------------------------------------------- */

    status(
      "Joining..."
    );


    message(
      "📡 Joining video room..."
    );


    const roomURL =
      METERED_DOMAIN +
      "/" +
      roomId;


    console.log(
      "Joining room:",
      roomURL
    );


    const meetingInfo =
      await meeting.join({

        roomURL:
          roomURL,

        name:
          "Ravi-" +
          userId.substring(0,6)

      });


    console.log(
      "✅ Metered joined:",
      meetingInfo
    );


    message(
      "✅ Video room joined..."
    );


    /* -----------------------------------------------
       STEP 5
       CAMERA
    ----------------------------------------------- */

    try{

      status(
        "Starting camera..."
      );


      message(
        "📷 Starting camera..."
      );


      await meeting.startVideo();


      console.log(
        "✅ Camera started"
      );


    }catch(cameraError){

      console.error(
        "Camera error:",
        cameraError
      );


      message(
        "⚠️ Camera permission needed"
      );

    }


    /* -----------------------------------------------
       STEP 6
       MICROPHONE
    ----------------------------------------------- */

    try{

      await meeting.startAudio();


      console.log(
        "✅ Microphone started"
      );


    }catch(audioError){

      console.error(
        "Microphone error:",
        audioError
      );

    }


    /* -----------------------------------------------
       CONNECTED
    ----------------------------------------------- */

    callButtons(true);


    status(
      "🟢 Connected"
    );


    message(
      "🎥 Video chat connected"
    );


    /* -----------------------------------------------
       GIFTS
    ----------------------------------------------- */

    listenForGifts(
      roomId
    );


  }catch(error){

    console.error(
      "❌ METERED CONNECTION ERROR:",
      error
    );


    meeting =
      null;


    remoteVideo.srcObject =
      null;


    localVideo.srcObject =
      null;


    callButtons(false);


    status(
      "Offline"
    );


    message(
      "❌ Connection failed"
    );


    alert(

      "Video connection failed:\n\n" +
      error.message

    );

  }

}


/* =====================================================
   START
===================================================== */

async function start(){

  if(busy){

    return;
  }


  busy = true;


  startBtn.disabled =
    true;


  try{

    status(
      "Online"
    );


    message(
      "🎥 Starting..."
    );


    await enterQueue();


    listenForMatch();


    const found =
      await findPartner();


    if(found){

      message(
        "🎉 Partner found! Connecting..."
      );

    }else{

      status(
        "Searching..."
      );


      message(
        "🔎 Waiting for a random partner..."
      );

    }

  }catch(error){

    console.error(
      "Start error:",
      error
    );


    status(
      "Offline"
    );


    message(
      "❌ Start failed"
    );


    startBtn.disabled =
      false;

  }


  busy = false;
}


/* =====================================================
   NEXT
===================================================== */

async function next(){

  if(busy){

    return;
  }


  busy = true;


  message(
    "⏭ Finding another partner..."
  );


  status(
    "Searching..."
  );


  try{

    await leaveMeeting();


    currentRoom =
      null;

    currentPartner =
      null;


    await enterQueue();


    listenForMatch();


    const found =
      await findPartner();


    if(!found){

      message(
        "🔎 Waiting for another partner..."
      );

    }

  }catch(error){

    console.error(
      "Next error:",
      error
    );


    message(
      "❌ Could not find next partner"
    );

  }


  busy = false;
}


/* =====================================================
   LEAVE MEETING
===================================================== */

async function leaveMeeting(){

  try{

    if(meeting){

      console.log(
        "Leaving meeting..."
      );


      if(
        typeof meeting.leaveMeeting ===
        "function"
      ){

        await meeting.leaveMeeting();

      }else if(
        typeof meeting.leave ===
        "function"
      ){

        await meeting.leave();

      }

    }

  }catch(error){

    console.log(
      "Leave meeting error:",
      error
    );

  }


  meeting =
    null;


  remoteVideo.srcObject =
    null;


  localVideo.srcObject =
    null;


  if(giftListener){

    giftListener();

    giftListener =
      null;
  }

}


/* =====================================================
   END CALL
===================================================== */

async function endCall(){

  if(busy){

    return;
  }


  await leaveMeeting();


  if(queueListener){

    queueListener();

    queueListener =
      null;
  }


  try{

    await deleteDoc(

      doc(
        db,
        "matchQueue",
        userId
      )

    );

  }catch(error){

    console.log(
      "Queue delete error:",
      error
    );

  }


  currentRoom =
    null;

  currentPartner =
    null;


  muted =
    false;

  cameraOff =
    false;


  muteBtn.innerText =
    "🎤";


  cameraBtn.innerText =
    "📷";


  callButtons(false);


  startBtn.disabled =
    false;


  status(
    "Offline"
  );


  message(
    "Press Start to begin"
  );

}


/* =====================================================
   MUTE
===================================================== */

muteBtn.onclick =
async()=>{

  if(!meeting){

    return;
  }


  try{

    if(!muted){

      await meeting.stopAudio();


      muted =
        true;


      muteBtn.innerText =
        "🔇";


      message(
        "🔇 Microphone muted"
      );

    }else{

      await meeting.startAudio();


      muted =
        false;


      muteBtn.innerText =
        "🎤";


      message(
        "🎤 Microphone on"
      );

    }

  }catch(error){

    console.error(
      "Audio error:",
      error
    );

  }

};


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.onclick =
async()=>{

  if(!meeting){

    return;
  }


  try{

    if(!cameraOff){

      await meeting.stopVideo();


      cameraOff =
        true;


      cameraBtn.innerText =
        "🚫";


      message(
        "🚫 Camera off"
      );

    }else{

      await meeting.startVideo();


      cameraOff =
        false;


      cameraBtn.innerText =
        "📷";


      message(
        "📷 Camera on"
      );

    }

  }catch(error){

    console.error(
      "Camera error:",
      error
    );

  }

};


/* =====================================================
   GIFT BUTTON
===================================================== */

giftBtn.onclick =
()=>{

  if(
    giftBox.style.display ===
    "block"
  ){

    giftBox.style.display =
      "none";

  }else{

    giftBox.style.display =
      "block";

  }

};


/* =====================================================
   SEND GIFT
===================================================== */

document
.querySelectorAll(".gift")
.forEach(button=>{

  button.onclick =
  async()=>{

    const gift =
      button.dataset.gift;


    giftBox.style.display =
      "none";


    showGift(
      gift
    );


    if(
      currentRoom &&
      currentPartner
    ){

      try{

        await setDoc(

          doc(

            collection(

              db,

              "rooms",

              currentRoom,

              "gifts"

            )

          ),

          {

            from:userId,

            to:currentPartner,

            gift:gift,

            createdAt:
              serverTimestamp()

          }

        );

      }catch(error){

        console.error(
          "Gift send error:",
          error
        );

      }

    }

  };

});


/* =====================================================
   GIFT ANIMATION
===================================================== */

function showGift(gift){

  giftAnimation.innerText =
    gift;


  giftAnimation.style.display =
    "block";


  setTimeout(()=>{

    giftAnimation.style.display =
      "none";

  },1000);

}


/* =====================================================
   RECEIVE GIFTS
===================================================== */

function listenForGifts(roomId){

  if(giftListener){

    giftListener();

    giftListener =
      null;
  }


  giftListener =
    onSnapshot(

      collection(

        db,

        "rooms",

        roomId,

        "gifts"

      ),

      snapshot=>{

        snapshot
          .docChanges()
          .forEach(change=>{

            if(
              change.type ===
              "added"
            ){

              const data =
                change.doc.data();


              if(
                data.to ===
                userId
              ){

                showGift(
                  data.gift
                );

              }

            }

          });

      },

      error=>{

        console.error(
          "Gift listener error:",
          error
        );

      }

    );

}
