<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ravi Random Video Chat</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  background:#111;
}

video{
  position:absolute;
  background:#000;
  object-fit:cover;
}

#remoteVideo{
  inset:0;
  width:100%;
  height:100%;
}

#localVideo{
  top:75px;
  right:12px;
  width:105px;
  height:150px;
  border:2px solid white;
  border-radius:15px;
  z-index:5;
}

#remoteAudio{
  display:none;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:18px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#000c,transparent);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.status{
  padding:8px 13px;
  border-radius:20px;
  background:#475569;
  font-size:12px;
}

.bottom{
  position:absolute;
  z-index:10;
  left:0;
  right:0;
  bottom:0;
  padding:20px 12px 28px;
  text-align:center;
  background:linear-gradient(transparent,#000e);
}

#message{
  font-size:14px;
  margin-bottom:15px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:0;
  color:white;
  font-weight:bold;
  font-size:15px;
  padding:14px 20px;
  border-radius:28px;
  cursor:pointer;
}

#startBtn{
  background:#16a34a;
}

#nextBtn{
  background:#2563eb;
}

#endBtn{
  background:#dc2626;
}

#muteBtn,
#cameraBtn{
  width:52px;
  height:52px;
  padding:0;
  border-radius:50%;
  background:#333;
}

button:disabled{
  opacity:.45;
}
</style>
</head>

<body>

<div id="app">

  <video id="remoteVideo"
         autoplay
         playsinline></video>

  <video id="localVideo"
         autoplay
         muted
         playsinline></video>

  <audio id="remoteAudio"
         autoplay></audio>

  <div class="top">
    <div class="logo">📹 Ravi Chat</div>
    <div id="status" class="status">Offline</div>
  </div>

  <div class="bottom">

    <div id="message">
      Press Start to begin
    </div>

    <div class="buttons">

      <button id="startBtn">
        ▶ Start
      </button>

      <button id="nextBtn" disabled>
        ⏭ Next
      </button>

      <button id="muteBtn" disabled>
        🎤
      </button>

      <button id="cameraBtn" disabled>
        📷
      </button>

      <button id="endBtn" disabled>
        ☎ End
      </button>

    </div>

  </div>

</div>


<!-- Metered Video SDK -->
<script src="https://cdn.metered.ca/sdk/video/1.4.6/sdk.min.js"></script>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  deleteDoc,
  collection,
  onSnapshot,
  query,
  where,
  getDocs,
  limit,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

  authDomain:
    "ravi-video-call-fa15d.firebaseapp.com",

  projectId:
    "ravi-video-call-fa15d",

  storageBucket:
    "ravi-video-call-fa15d.firebasestorage.app",

  messagingSenderId:
    "1079442344769",

  appId:
    "1:1079442344769:web:d7812efaf277c3f6d4efc0",

  measurementId:
    "G-69RY93XC91"
};


const firebaseApp =
  initializeApp(firebaseConfig);

const db =
  getFirestore(firebaseApp);


/* =====================================================
   METERED
===================================================== */

const METERED_DOMAIN =
  "ravi-video-call.metered.live";


/*
   IMPORTANT:

   Secret Key यहाँ नराख्नुहोस्।
*/


/* =====================================================
   ELEMENTS
===================================================== */

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const remoteAudio =
  document.getElementById("remoteAudio");

const startBtn =
  document.getElementById("startBtn");

const nextBtn =
  document.getElementById("nextBtn");

const endBtn =
  document.getElementById("endBtn");

const muteBtn =
  document.getElementById("muteBtn");

const cameraBtn =
  document.getElementById("cameraBtn");

const statusEl =
  document.getElementById("status");

const messageEl =
  document.getElementById("message");


/* =====================================================
   USER STATE
===================================================== */

let userId =
  crypto.randomUUID();

let meeting = null;

let queueListener = null;

let currentRoom = null;

let currentPartner = null;

let muted = false;

let cameraOff = false;

let busy = false;


/* =====================================================
   UI
===================================================== */

function setStatus(text){

  statusEl.innerText = text;

  if(
    text.includes("Online") ||
    text.includes("Connected")
  ){

    statusEl.style.background =
      "#16a34a";

  }else if(
    text.includes("Searching") ||
    text.includes("Connecting")
  ){

    statusEl.style.background =
      "#f59e0b";

  }else{

    statusEl.style.background =
      "#475569";
  }
}


function setMessage(text){

  messageEl.innerText = text;
}


function setCallButtons(enabled){

  nextBtn.disabled =
    !enabled;

  endBtn.disabled =
    !enabled;

  muteBtn.disabled =
    !enabled;

  cameraBtn.disabled =
    !enabled;
}


/* =====================================================
   RANDOM ROOM
===================================================== */

function createRoomId(){

  return (
    "ravi-" +
    Math.random()
      .toString(36)
      .substring(2,10)
  );
}


/* =====================================================
   QUEUE
===================================================== */

async function enterQueue(){

  const myRef =
    doc(
      db,
      "matchQueue",
      userId
    );

  await setDoc(
    myRef,
    {
      userId:userId,
      state:"waiting",
      partner:null,
      roomId:null,
      createdAt:Date.now()
    },
    {
      merge:true
    }
  );
}


/* =====================================================
   FIND PARTNER SAFELY
===================================================== */

async function findPartner(){

  try{

    const q =
      query(
        collection(
          db,
          "matchQueue"
        ),
        where(
          "state",
          "==",
          "waiting"
        ),
        limit(10)
      );

    const snapshot =
      await getDocs(q);


    for(
      const candidate of snapshot.docs
    ){

      const candidateData =
        candidate.data();

      const partnerId =
        candidateData.userId;


      if(
        partnerId === userId
      ){
        continue;
      }


      const myRef =
        doc(
          db,
          "matchQueue",
          userId
        );

      const partnerRef =
        doc(
          db,
          "matchQueue",
          partnerId
        );


      const roomId =
        createRoomId();


      /*
         TRANSACTION

         यसले दुई फोनले एउटै व्यक्तिलाई
         simultaneously claim गर्ने समस्या रोक्छ।
      */

      const matched =
        await runTransaction(
          db,
          async(transaction)=>{

            const mySnap =
              await transaction.get(
                myRef
              );

            const partnerSnap =
              await transaction.get(
                partnerRef
              );


            if(
              !mySnap.exists() ||
              !partnerSnap.exists()
            ){

              return false;
            }


            const myData =
              mySnap.data();

            const partnerData =
              partnerSnap.data();


            if(
              myData.state !==
              "waiting"
            ){

              return false;
            }


            if(
              partnerData.state !==
              "waiting"
            ){

              return false;
            }


            /*
               BOTH users receive
               EXACT SAME room ID.
            */

            transaction.update(
              myRef,
              {
                state:"matched",
                partner:partnerId,
                roomId:roomId
              }
            );


            transaction.update(
              partnerRef,
              {
                state:"matched",
                partner:userId,
                roomId:roomId
              }
            );


            return true;
          }
        );


      if(matched){

        currentRoom =
          roomId;

        currentPartner =
          partnerId;

        return true;
      }

    }

  }catch(error){

    console.error(
      "Matching error:",
      error
    );

  }


  return false;
}


/* =====================================================
   LISTEN FOR MATCH
===================================================== */

function listenForMatch(){

  if(queueListener){

    queueListener();

    queueListener =
      null;
  }


  const myRef =
    doc(
      db,
      "matchQueue",
      userId
    );


  queueListener =
    onSnapshot(
      myRef,
      async(snapshot)=>{

        if(
          !snapshot.exists()
        ){

          return;
        }


        const data =
          snapshot.data();


        if(
          data.state ===
          "matched" &&
          data.roomId
        ){

          /*
             Avoid joining same room twice.
          */

          if(
            currentRoom ===
            data.roomId &&
            meeting
          ){

            return;
          }


          currentRoom =
            data.roomId;

          currentPartner =
            data.partner;


          setMessage(
            "🎉 Partner found! Connecting..."
          );

          setStatus(
            "Connecting..."
          );


          await joinMeteredRoom(
            data.roomId
          );
        }

      }
    );
}


/* =====================================================
   METERED ROOM
===================================================== */

async function joinMeteredRoom(
  roomId
){

  if(meeting){

    return;
  }


  try{

    if(
      !window.Metered
    ){

      throw new Error(
        "Metered SDK did not load."
      );
    }


    meeting =
      new Metered.Meeting();


    /*
       IMPORTANT:

       Event listeners BEFORE join().
    */


    /* LOCAL VIDEO */

    meeting.on(
      "localTrackStarted",
      function(item){

        console.log(
          "Local track:",
          item
        );


        if(
          item.type ===
          "video"
        ){

          const stream =
            new MediaStream([
              item.track
            ]);


          localVideo.srcObject =
            stream;


          localVideo
            .play()
            .catch(()=>{});
        }

      }
    );


    /* REMOTE TRACK */

    meeting.on(
      "remoteTrackStarted",
      function(item){

        console.log(
          "Remote track:",
          item
        );


        const stream =
          new MediaStream([
            item.track
          ]);


        if(
          item.type ===
          "video"
        ){

          remoteVideo.srcObject =
            stream;


          remoteVideo
            .play()
            .catch(()=>{});


          setStatus(
            "🟢 Connected"
          );

          setMessage(
            "🎥 Video chat connected"
          );

          setCallButtons(
            true
          );
        }


        /*
           REMOTE AUDIO

           Audio track अलगै audio element
           मा राखिन्छ।
        */

        if(
          item.type ===
          "audio"
        ){

          remoteAudio.srcObject =
            stream;


          remoteAudio
            .play()
            .catch(error=>{
              console.log(
                "Audio autoplay:",
                error
              );
            });
        }

      }
    );


    /* PARTICIPANT JOINED */

    meeting.on(
      "participantJoined",
      function(info){

        console.log(
          "Participant joined:",
          info
        );


        setStatus(
          "🟢 Connected"
        );

        setMessage(
          "🎥 Video chat connected"
        );

        setCallButtons(
          true
        );
      }
    );


    /* PARTICIPANT LEFT */

    meeting.on(
      "participantLeft",
      function(info){

        console.log(
          "Participant left:",
          info
        );


        remoteVideo.srcObject =
          null;

        remoteAudio.srcObject =
          null;


        setStatus(
          "Online"
        );

        setMessage(
          "👋 Partner left. Press Next."
        );
      }
    );


    /*
       JOIN SAME ROOM
       ON BOTH PHONES
    */

    const roomURL =
      METERED_DOMAIN +
      "/" +
      roomId;


    const meetingInfo =
      await meeting.join({
        roomURL:roomURL,
        name:"Ravi User"
      });


    console.log(
      "Meeting joined:",
      meetingInfo
    );


    /*
       START CAMERA
    */

    try{

      await meeting.startVideo();

    }catch(error){

      console.error(
        "Camera error:",
        error
      );
    }


    /*
       START MICROPHONE
    */

    try{

      await meeting.startAudio();

    }catch(error){

      console.error(
        "Microphone error:",
        error
      );
    }


    setCallButtons(
      true
    );


  }catch(error){

    console.error(
      "Metered connection error:",
      error
    );


    meeting =
      null;


    setStatus(
      "Offline"
    );


    setMessage(
      "❌ Connection failed"
    );


    alert(
      "Video connection error:\n" +
      error.message
    );
  }
}


/* =====================================================
   START
===================================================== */

async function startRandomChat(){

  if(busy){

    return;
  }


  busy =
    true;


  startBtn.disabled =
    true;


  try{

    setStatus(
      "🟢 Online"
    );


    setMessage(
      "🎥 Starting camera and microphone..."
    );


    /*
       Camera permission will be requested
       by Metered.
    */


    setMessage(
      "🔎 Finding a random partner..."
    );


    setStatus(
      "Searching..."
    );


    await enterQueue();


    listenForMatch();


    /*
       First try to find somebody.
    */

    const found =
      await findPartner();


    if(!found){

      setMessage(
        "🔎 Waiting for a random partner..."
      );

      setStatus(
        "Searching..."
      );
    }


  }catch(error){

    console.error(
      error
    );


    console.log(
      "Start error:",
      error.message
    );


    setStatus(
      "Offline"
    );


    setMessage(
      "❌ Could not start"
    );


    startBtn.disabled =
      false;

  }


  busy =
    false;
}


/* =====================================================
   LEAVE METERED
===================================================== */

async function leaveCurrentMeeting(){

  try{

    if(meeting){

      if(
        typeof meeting.leaveMeeting ===
        "function"
      ){

        await meeting.leaveMeeting();

      }else if(
        typeof meeting.leave ===
        "function"
      ){

        await meeting.leave();
      }
    }

  }catch(error){

    console.log(
      "Leave error:",
      error
    );
  }


  meeting =
    null;


  remoteVideo.srcObject =
    null;

  remoteAudio.srcObject =
    null;
}


/* =====================================================
   NEXT
===================================================== */

async function nextPartner(){

  if(busy){

    return;
  }


  busy =
    true;


  try{

    setMessage(
      "⏭ Finding another partner..."
    );

    setStatus(
      "Searching..."
    );


    await leaveCurrentMeeting();


    currentRoom =
      null;

    currentPartner =
      null;


    /*
       Put current user back into queue.
    */

    await enterQueue();


    listenForMatch();


    const found =
      await findPartner();


    if(!found){

      setMessage(
        "🔎 Waiting for another random partner..."
      );

      setStatus(
        "Searching..."
      );
    }


  }catch(error){

    console.error(
      "Next error:",
      error
    );

    setMessage(
      "❌ Could not find another partner"
    );

  }


  busy =
    false;
}


/* =====================================================
   END
===================================================== */

async function endCall(){

  await leaveCurrentMeeting();


  if(queueListener){

    queueListener();

    queueListener =
      null;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "matchQueue",
        userId
      )
    );

  }catch(error){

    console.log(
      "Queue delete error:",
      error
    );
  }


  currentRoom =
    null;

  currentPartner =
    null;

  muted =
    false;

  cameraOff =
    false;


  muteBtn.innerText =
    "🎤";

  cameraBtn.innerText =
    "📷";


  setCallButtons(
    false
  );


  startBtn.disabled =
    false;


  setStatus(
    "Offline"
  );


  setMessage(
    "Press Start to begin"
  );
}


/* =====================================================
   MUTE
===================================================== */

muteBtn.onclick =
  async function(){

    if(!meeting){

      return;
    }


    try{

      if(!muted){

        if(
          typeof meeting.stopAudio ===
          "function"
        ){

          await meeting.stopAudio();
        }


        muted =
          true;


        muteBtn.innerText =
          "🔇";

      }else{

        if(
          typeof meeting.startAudio ===
          "function"
        ){

          await meeting.startAudio();
        }


        muted =
          false;


        muteBtn.innerText =
          "🎤";
      }

    }catch(error){

      console.log(
        "Mute error:",
        error
      );
    }
  };


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.onclick =
  async function(){

    if(!meeting){

      return;
    }


    try{

      if(!cameraOff){

        if(
          typeof meeting.stopVideo ===
          "function"
        ){

          await meeting.stopVideo();
        }


        cameraOff =
          true;


        cameraBtn.innerText =
          "🚫";

      }else{

        if(
          typeof meeting.startVideo ===
          "function"
        ){

          await meeting.startVideo();
        }


        cameraOff =
          false;


        cameraBtn.innerText =
          "📷";
      }

    }catch(error){

      console.log(
        "Camera error:",
        error
      );
    }
  };


/* =====================================================
   BUTTONS
===================================================== */

startBtn.onclick =
  startRandomChat;

nextBtn.onclick =
  nextPartner;

endBtn.onclick =
  endCall;


/* =====================================================
   INITIAL
===================================================== */

setStatus(
  "Offline"
);

setMessage(
  "Press Start to begin"
);

setCallButtons(
  false
);

</script>

</body>
</html>
