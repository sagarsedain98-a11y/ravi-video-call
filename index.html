<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ravi Chat</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  position:relative;
  width:100%;
  height:100%;
  background:#111;
}

video{
  position:absolute;
  background:#000;
  object-fit:cover;
}

#remoteVideo{
  width:100%;
  height:100%;
  inset:0;
}

#localVideo{
  position:absolute;
  top:70px;
  right:12px;
  width:110px;
  height:155px;
  border:2px solid #fff;
  border-radius:15px;
  z-index:5;
  background:#000;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:10;
  padding:17px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#000d,transparent);
}

.logo{
  font-size:20px;
  font-weight:bold;
}

#status{
  padding:7px 12px;
  border-radius:20px;
  background:#475569;
  font-size:12px;
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:10;
  text-align:center;
  padding:18px 10px 28px;
  background:linear-gradient(transparent,#000e);
}

#message{
  margin-bottom:14px;
  font-size:14px;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  padding:13px 18px;
  border-radius:25px;
  cursor:pointer;
}

#startBtn{
  background:#16a34a;
}

#nextBtn{
  background:#2563eb;
}

#endBtn{
  background:#dc2626;
}

#giftBtn{
  background:#db2777;
}

.small{
  width:50px;
  height:50px;
  padding:0;
  border-radius:50%;
  background:#333;
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

#giftBox{
  display:none;
  position:absolute;
  bottom:105px;
  left:50%;
  transform:translateX(-50%);
  z-index:30;
  width:280px;
  padding:15px;
  border-radius:20px;
  background:#202020;
  box-shadow:0 10px 30px #000;
}

#giftBox h3{
  margin:5px 0 15px;
}

.gifts{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.gift{
  background:#333;
  border-radius:15px;
  padding:12px 5px;
  cursor:pointer;
  font-size:25px;
  text-align:center;
}

#giftAnimation{
  display:none;
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:50;
  font-size:90px;
  animation:pop .8s ease;
  pointer-events:none;
}

@keyframes pop{

  0%{
    transform:translate(-50%,-50%) scale(.2);
  }

  70%{
    transform:translate(-50%,-50%) scale(1.3);
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
  }

}

</style>
</head>


<body>

<div id="app">

  <!-- REMOTE VIDEO -->

  <video
    id="remoteVideo"
    autoplay
    playsinline>
  </video>


  <!-- LOCAL VIDEO -->

  <video
    id="localVideo"
    autoplay
    muted
    playsinline>
  </video>


  <!-- GIFT ANIMATION -->

  <div id="giftAnimation"></div>


  <!-- TOP BAR -->

  <div class="top">

    <div class="logo">
      📹 Ravi Chat
    </div>

    <div id="status">
      Offline
    </div>

  </div>


  <!-- GIFT BOX -->

  <div id="giftBox">

    <h3>
      🎁 Send Gift
    </h3>

    <div class="gifts">

      <div class="gift" data-gift="❤️">
        ❤️
      </div>

      <div class="gift" data-gift="🌹">
        🌹
      </div>

      <div class="gift" data-gift="⭐">
        ⭐
      </div>

      <div class="gift" data-gift="🎉">
        🎉
      </div>

      <div class="gift" data-gift="💎">
        💎
      </div>

      <div class="gift" data-gift="🔥">
        🔥
      </div>

      <div class="gift" data-gift="🎂">
        🎂
      </div>

      <div class="gift" data-gift="👑">
        👑
      </div>

    </div>

  </div>


  <!-- BOTTOM CONTROLS -->

  <div class="bottom">

    <div id="message">
      Press Start to begin
    </div>


    <div class="buttons">

      <button id="startBtn">
        ▶ Start
      </button>

      <button
        id="nextBtn"
        disabled>
        ⏭ Next
      </button>

      <button
        id="muteBtn"
        class="small"
        disabled>
        🎤
      </button>

      <button
        id="cameraBtn"
        class="small"
        disabled>
        📷
      </button>

      <button
        id="giftBtn"
        disabled>
        🎁 Gift
      </button>

      <button
        id="endBtn"
        disabled>
        ☎ End
      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     METERED SDK
===================================================== -->

<script src="https://cdn.metered.ca/sdk/video/1.4.6/sdk.min.js"></script>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
  getFirestore,
  doc,
  setDoc,
  deleteDoc,
  collection,
  query,
  where,
  limit,
  getDocs,
  onSnapshot,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyBclGWenPPhTCXetZ1rtj1KaRQ9dgvshas",

  authDomain:
    "ravi-video-call-fa15d.firebaseapp.com",

  projectId:
    "ravi-video-call-fa15d",

  storageBucket:
    "ravi-video-call-fa15d.firebasestorage.app",

  messagingSenderId:
    "1079442344769",

  appId:
    "1:1079442344769:web:d7812efaf277c3f6d4efc0",

  measurementId:
    "G-69RY93XC91"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getFirestore(app);


/* =====================================================
   BACKEND
===================================================== */

const CREATE_ROOM_API =
  "/api/create-room";


/* =====================================================
   ELEMENTS
===================================================== */

const localVideo =
  document.getElementById(
    "localVideo"
  );


const remoteVideo =
  document.getElementById(
    "remoteVideo"
  );


const startBtn =
  document.getElementById(
    "startBtn"
  );


const nextBtn =
  document.getElementById(
    "nextBtn"
  );


const endBtn =
  document.getElementById(
    "endBtn"
  );


const muteBtn =
  document.getElementById(
    "muteBtn"
  );


const cameraBtn =
  document.getElementById(
    "cameraBtn"
  );


const giftBtn =
  document.getElementById(
    "giftBtn"
  );


const giftBox =
  document.getElementById(
    "giftBox"
  );


const giftAnimation =
  document.getElementById(
    "giftAnimation"
  );


const statusEl =
  document.getElementById(
    "status"
  );


const messageEl =
  document.getElementById(
    "message"
  );


/* =====================================================
   STATE
===================================================== */

const userId =
  crypto.randomUUID();


let meeting = null;

let queueListener = null;

let giftListener = null;

let currentRoom = null;

let currentPartner = null;

let muted = false;

let cameraOff = false;

let busy = false;


/* =====================================================
   UI
===================================================== */

function status(text){

  statusEl.innerText =
    text;


  if(
    text.includes("Connected") ||
    text.includes("Online")
  ){

    statusEl.style.background =
      "#16a34a";

  }

  else if(
    text.includes("Searching") ||
    text.includes("Connecting")
  ){

    statusEl.style.background =
      "#f59e0b";

  }

  else{

    statusEl.style.background =
      "#475569";

  }

}


function message(text){

  messageEl.innerText =
    text;

}


function callButtons(enabled){

  nextBtn.disabled =
    !enabled;

  endBtn.disabled =
    !enabled;

  muteBtn.disabled =
    !enabled;

  cameraBtn.disabled =
    !enabled;

  giftBtn.disabled =
    !enabled;

}


/* =====================================================
   QUEUE
===================================================== */

async function enterQueue(){

  await setDoc(

    doc(
      db,
      "matchQueue",
      userId
    ),

    {

      userId:userId,

      state:"waiting",

      partner:null,

      roomId:null,

      createdAt:
        serverTimestamp()

    }

  );

}


/* =====================================================
   FIND PARTNER
===================================================== */

async function findPartner(){

  const q =
    query(

      collection(
        db,
        "matchQueue"
      ),

      where(
        "state",
        "==",
        "waiting"
      ),

      limit(10)

    );


  const snapshot =
    await getDocs(q);


  for(
    const candidate
    of snapshot.docs
  ){

    const partnerId =
      candidate.data().userId;


    if(
      partnerId === userId
    )
      continue;


    const myRef =
      doc(
        db,
        "matchQueue",
        userId
      );


    const partnerRef =
      doc(
        db,
        "matchQueue",
        partnerId
      );


    const roomId =
      "ravi-" +
      Math.random()
        .toString(36)
        .substring(2,10);


    const success =
      await runTransaction(

        db,

        async(transaction)=>{

          const me =
            await transaction.get(
              myRef
            );


          const partner =
            await transaction.get(
              partnerRef
            );


          if(
            !me.exists() ||
            !partner.exists()
          ){

            return false;

          }


          if(
            me.data().state !==
              "waiting" ||

            partner.data().state !==
              "waiting"
          ){

            return false;

          }


          transaction.update(

            myRef,

            {

              state:"matched",

              partner:
                partnerId,

              roomId:
                roomId

            }

          );


          transaction.update(

            partnerRef,

            {

              state:"matched",

              partner:
                userId,

              roomId:
                roomId

            }

          );


          return true;

        }

      );


    if(success){

      currentRoom =
        roomId;

      currentPartner =
        partnerId;

      return true;

    }

  }


  return false;

}


/* =====================================================
   MATCH LISTENER
===================================================== */

function listenForMatch(){

  if(queueListener){

    queueListener();

  }


  queueListener =

    onSnapshot(

      doc(
        db,
        "matchQueue",
        userId
      ),

      async(snapshot)=>{

        if(
          !snapshot.exists()
        )
          return;


        const data =
          snapshot.data();


        if(

          data.state ===
            "matched" &&

          data.roomId

        ){

          if(

            meeting &&

            currentRoom ===
              data.roomId

          ){

            return;

          }


          currentRoom =
            data.roomId;


          currentPartner =
            data.partner;


          message(
            "🎉 Partner found! Connecting..."
          );


          status(
            "Connecting..."
          );


          await connectMetered(
            data.roomId
          );

        }

      }

    );

}


/* =====================================================
   CREATE METERED ROOM
===================================================== */

async function createMeteredRoom(
  roomId
){

  const response =
    await fetch(

      CREATE_ROOM_API,

      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            roomName:
              roomId

          })

      }

    );


  if(
    !response.ok
  ){

    const text =
      await response.text();


    throw new Error(
      text ||
      "Backend room creation failed"
    );

  }


  return await response.json();

}


/* =====================================================
   METERED CONNECT
===================================================== */

async function connectMetered(
  roomId
){

  try{

    status(
      "Connecting..."
    );


    message(
      "📡 Joining video room..."
    );


    if(
      !window.Metered
    ){

      throw new Error(
        "Metered SDK did not load"
      );

    }


    /* Create room using backend */

    const roomResult =
      await createMeteredRoom(
        roomId
      );


    console.log(
      "Metered room:",
      roomResult
    );


    /* Create meeting */

    meeting =
      new Metered.Meeting();


    /* =================================================
       LOCAL TRACK
    ================================================= */

    meeting.on(

      "localTrackStarted",

      async(item)=>{

        console.log(
          "Local track:",
          item
        );


        if(
          item.type ===
          "video"
        ){

          const stream =
            new MediaStream();


          stream.addTrack(
            item.track
          );


          localVideo.srcObject =
            stream;


          try{

            await localVideo.play();

          }

          catch(error){

            console.log(
              "Local video play error:",
              error
            );

          }

        }

      }

    );


    /* =================================================
       REMOTE TRACK
    ================================================= */

    meeting.on(

      "remoteTrackStarted",

      async(item)=>{

        console.log(
          "Remote track:",
          item
        );


        if(
          item.type ===
          "video"
        ){

          const stream =
            new MediaStream();


          stream.addTrack(
            item.track
          );


          remoteVideo.srcObject =
            stream;


          try{

            await remoteVideo.play();

          }

          catch(error){

            console.log(
              "Remote video play error:",
              error
            );

          }


          status(
            "🟢 Connected"
          );


          message(
            "🎥 Video chat connected"
          );


          callButtons(true);

        }

      }

    );


    /* =================================================
       PARTICIPANT JOINED
    ================================================= */

    meeting.on(

      "participantJoined",

      info=>{

        console.log(
          "👤 Participant joined:",
          info
        );


        status(
          "🟢 Connected"
        );


        message(
          "🎥 Partner connected"
        );


        callButtons(true);

      }

    );


    /* =================================================
       PARTICIPANT LEFT
    ================================================= */

    meeting.on(

      "participantLeft",

      info=>{

        console.log(
          "👋 Participant left:",
          info
        );


        remoteVideo.srcObject =
          null;


        status(
          "Online"
        );


        message(
          "👋 Partner left. Press Next."
        );

      }

    );


    /* =================================================
       JOIN METERED ROOM
    ================================================= */

    const meetingInfo =
      await meeting.join({

        roomURL:
          "ravi-video-call.metered.live/" +
          roomId,

        name:
          "Ravi-" +
          userId.substring(
            0,
            6
          )

      });


    console.log(
      "✅ Metered joined:",
      meetingInfo
    );


    /* =================================================
       START CAMERA
    ================================================= */

    await meeting.startVideo();


    /* =================================================
       START MICROPHONE
    ================================================= */

    await meeting.startAudio();


    /* Enable buttons */

    callButtons(true);


    /* Listen for gifts */

    listenForGifts(
      roomId
    );


  }

  catch(error){

    console.error(
      "❌ Metered connection error:",
      error
    );


    meeting =
      null;


    remoteVideo.srcObject =
      null;


    localVideo.srcObject =
      null;


    callButtons(false);


    status(
      "Offline"
    );


    message(
      "❌ Connection failed"
    );


    alert(
      "Video connection failed:\n\n" +
      error.message
    );

  }

}


/* =====================================================
   START
===================================================== */

async function start(){

  if(busy)
    return;


  busy = true;


  startBtn.disabled =
    true;


  try{

    status(
      "Online"
    );


    message(
      "🎥 Starting..."
    );


    await enterQueue();


    listenForMatch();


    const found =
      await findPartner();


    if(!found){

      status(
        "Searching..."
      );


      message(
        "🔎 Waiting for a random partner..."
      );

    }

  }

  catch(error){

    console.error(
      error
    );


    status(
      "Offline"
    );


    message(
      "❌ Start failed"
    );


    startBtn.disabled =
      false;

  }


  busy = false;

}


/* =====================================================
   NEXT
===================================================== */

async function next(){

  if(busy)
    return;


  busy = true;


  message(
    "⏭ Finding another partner..."
  );


  status(
    "Searching..."
  );


  await leaveMeeting();


  currentRoom =
    null;


  currentPartner =
    null;


  await enterQueue();


  listenForMatch();


  const found =
    await findPartner();


  if(!found){

    message(
      "🔎 Waiting for another partner..."
    );

  }


  busy = false;

}


/* =====================================================
   LEAVE MEETING
===================================================== */

async function leaveMeeting(){

  try{

    if(meeting){

      if(
        typeof meeting.leaveMeeting ===
        "function"
      ){

        await meeting.leaveMeeting();

      }

      else if(
        typeof meeting.leave ===
        "function"
      ){

        await meeting.leave();

      }

    }

  }

  catch(error){

    console.log(
      "Leave error:",
      error
    );

  }


  meeting =
    null;


  remoteVideo.srcObject =
    null;


  localVideo.srcObject =
    null;


  if(giftListener){

    giftListener();

    giftListener =
      null;

  }

}


/* =====================================================
   END CALL
===================================================== */

async function endCall(){

  await leaveMeeting();


  if(queueListener){

    queueListener();

    queueListener =
      null;

  }


  try{

    await deleteDoc(

      doc(
        db,
        "matchQueue",
        userId
      )

    );

  }

  catch(error){

    console.log(
      error
    );

  }


  currentRoom =
    null;


  currentPartner =
    null;


  callButtons(false);


  startBtn.disabled =
    false;


  status(
    "Offline"
  );


  message(
    "Press Start to begin"
  );

}


/* =====================================================
   MUTE
===================================================== */

muteBtn.onclick =
async()=>{

  if(!meeting)
    return;


  try{

    if(!muted){

      await meeting.stopAudio();


      muted =
        true;


      muteBtn.innerText =
        "🔇";

    }

    else{

      await meeting.startAudio();


      muted =
        false;


      muteBtn.innerText =
        "🎤";

    }

  }

  catch(error){

    console.log(
      error
    );

  }

};


/* =====================================================
   CAMERA
===================================================== */

cameraBtn.onclick =
async()=>{

  if(!meeting)
    return;


  try{

    if(!cameraOff){

      await meeting.stopVideo();


      cameraOff =
        true;


      cameraBtn.innerText =
        "🚫";

    }

    else{

      await meeting.startVideo();


      cameraOff =
        false;


      cameraBtn.innerText =
        "📷";

    }

  }

  catch(error){

    console.log(
      error
    );

  }

};


/* =====================================================
   GIFT BUTTON
===================================================== */

giftBtn.onclick = ()=>{

  if(
    giftBox.style.display ===
    "block"
  ){

    giftBox.style.display =
      "none";

  }

  else{

    giftBox.style.display =
      "block";

  }

};


/* =====================================================
   SEND GIFT
===================================================== */

document
  .querySelectorAll(".gift")
  .forEach(button=>{

    button.onclick =
    async()=>{

      const gift =
        button.dataset.gift;


      giftBox.style.display =
        "none";


      showGift(
        gift
      );


      if(
        currentRoom &&
        currentPartner
      ){

        try{

          await setDoc(

            doc(

              collection(
                db,
                "rooms",
                currentRoom,
                "gifts"
              )

            ),

            {

              from:
                userId,

              to:
                currentPartner,

              gift:
                gift,

              createdAt:
                serverTimestamp()

            }

          );

        }

        catch(error){

          console.log(
            "Gift error:",
            error
          );

        }

      }

    };

  });


/* =====================================================
   GIFT ANIMATION
===================================================== */

function showGift(
  gift
){

  giftAnimation.innerText =
    gift;


  giftAnimation.style.display =
    "block";


  setTimeout(()=>{

    giftAnimation.style.display =
      "none";

  },1000);

}


/* =====================================================
   RECEIVE GIFTS
===================================================== */

function listenForGifts(
  roomId
){

  if(giftListener){

    giftListener();

  }


  giftListener =
    onSnapshot(

      collection(
        db,
        "rooms",
        roomId,
        "gifts"
      ),

      snapshot=>{

        snapshot.docChanges()
          .forEach(change=>{

            if(
              change.type ===
              "added"
            ){

              const data =
                change.doc.data();


              if(
                data.to ===
                userId
              ){

                showGift(
                  data.gift
                );

              }

            }

          });

      }

    );

}


/* =====================================================
   BUTTONS
===================================================== */

startBtn.onclick =
  start;


nextBtn.onclick =
  next;


endBtn.onclick =
  endCall;


/* =====================================================
   INITIAL
===================================================== */

status(
  "Offline"
);


message(
  "Press Start to begin"
);


callButtons(
  false
);

</script>

</body>
</html>
